 '漢字読み':'間違えた漢字は、読みを書いて覚えましょう。毎日5個ずつがおすすめです。','漢字書き':'間違えた漢字は、3回書いて覚え直しましょう。','語句':'意味があいまいな語句は、短文を自分で作ってみましょう。','国語|文法':'品詞と活用の表を見直しましょう。','古文':'古文単語と歴史的仮名遣いを整理しましょう。','現代文':'本文の根拠になる一文に線を引いてから選択肢を見ましょう。',
 '物理':'公式（オームの法則など）を書き出して、単位つきで計算練習しましょう。','化学':'質量保存と比の計算を、図を書いて整理しましょう。','生物':'用語を図とセットで覚え直しましょう。','地学':'天体や天気の仕組みを、図で説明できるか確かめましょう。',
 '地理':'地図帳と一緒に、位置と特色をセットで覚えましょう。','歴史':'年表をつくり、出来事を原因と結果でつなげて覚えましょう。','公民':'用語の意味を自分の言葉で説明できるようにしましょう。',
 '計算':'途中式を丁寧に書き、符号ミスがないか確認しましょう。'
};
function analyzeMock(r){
  var by={};
  r.rows.forEach(function(x){ var u=x.q.u, o=by[u]||(by[u]={u:u,n:0,c:0,blank:0}); o.n++; if(x.ok) o.c++; if(!x.given) o.blank++; });
  var arr=Object.keys(by).map(function(k){ var o=by[k]; o.r=o.c/o.n; return o; });
  var weak=arr.filter(function(o){return o.n>=2&&o.r<0.6;}).sort(function(a,b){return a.r-b.r||b.n-a.n;}).slice(0,3);
  var strong=arr.filter(function(o){return o.n>=2&&o.r>=0.8;}).sort(function(a,b){return b.r-a.r||b.n-a.n;}).slice(0,3);
  var blank=r.rows.filter(function(x){return !x.given;}).length;
  var h='<section class="card stack"><span class="tag">結果の分析</span>';
  var sc=r.score;
  h+='<p style="margin:0">'+(sc>=80?'とてもよくできています。この調子で、ミスした問題を確実に直していきましょう。':sc>=60?'基本はできています。苦手な単元を直せば、さらに点が伸びます。':sc>=40?'あと少しで半分以上です。まずは苦手な単元から1つずつ片づけましょう。':'まだ伸びしろがたくさんあります。やさしい単元から確実に点を取りましょう。')+'</p>';
  if(strong.length) h+='<div><span class="tag">得意なところ</span>'+strong.map(function(o){return '<div class="urow" style="grid-template-columns:minmax(0,1fr) 5em"><span>'+esc(o.u)+'</span><span class="v">'+o.c+' / '+o.n+'</span></div>';}).join('')+'</div>';
  if(weak.length){
    h+='<div><span class="tag">がんばりたいところ</span>'+weak.map(function(o){
      return '<div class="urow" style="grid-template-columns:minmax(0,1fr) 5em"><span>'+esc(o.u)+'</span><span class="v">'+o.c+' / '+o.n+'</span></div><p class="sub" style="margin:2px 0 8px">'+esc(TIPS[r.s+'|'+o.u]||TIPS[o.u]||'間違えた問題を見直しましょう。')+'</p><button class="chip" data-act="pracunit" data-v="'+r.s+'|'+esc(o.u)+'">この単元を練習する</button>';
    }).join('')+'</div>';
  }else if(!strong.length) h+='<p class="sub" style="margin:0">単元ごとの差は、はっきり出ませんでした。全体をまんべんなく復習しましょう。</p>';
  var notes=[];
  if(blank>=3) notes.push('未回答が '+blank+' 問ありました。わからなくても、選択問題は最後に選んでおくと得点のチャンスが残ります。');
  var tl=r.used/MOCK_SEC;
  if(tl<0.6&&sc<70) notes.push('時間を '+Math.round((1-tl)*100)+'% 残して終わっています。見直しの時間にまわすと、ケアレスミスを減らせます。');
  if(tl>=0.97&&blank>=3) notes.push('時間がぎりぎりでした。わからない問題は先に飛ばして、解ける問題から取りましょう。');
  var worstSec=-1,wr=2; r.def.secs.forEach(function(x,i){ var m=r.secScore[i]; if(m.max&&m.got/m.max<wr){ wr=m.got/m.max; worstSec=i; } });
  if(worstSec>=0&&wr<0.6) notes.push('大問のなかでは「'+r.def.secs[worstSec].t.replace(/^大問\d+　/,'')+'」が最も点を落としています。次はここを重点的に。');
  var prev=S.mocks.filter(function(m){return m.s===r.s;}).slice(0,-1);
  if(prev.length){ var pb=prev[prev.length-1].score, df=sc-pb; notes.push('前回の'+r.def.name+'の模擬テストより '+(df>0?df+' 点アップしました。':df<0?(-df)+' 点下がりました。次で取り戻しましょう。':'同じ点数でした。')); }
  if(notes.length) h+='<ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px">'+notes.map(function(n){return '<li>'+esc(n)+'</li>';}).join('')+'</ul>';
  h+='<p class="sub" style="margin:0">この分析は、今回の点数にもとづく自動の目安です。</p></section>';
  return h;
}

  else if(a==='rleaveyes'){ rkLeave(); return; }
  else if(a==='subj'){ st8.setup={s:v,u:'all'}; st8.mode='setup'; }
  else if(a==='pracunit'){
    var pu=v.split('|'); st8.setup={s:pu[0],u:pu[1]};
    startQuiz(buildSet(ALL.filter(function(q){return q.s===pu[0]&&q.u===pu[1];}),10)); return;
  }
  else if(a==='unit'){ st8.setup.u=v; }
  else if(a==='home'){ st8.mode=null; st8.tab='home'; }
  else if(a==='start'||a==='again'){
    var s=st8.setup, pool=ALL.filter(function(q){ return (s.s==='all'||q.s===s.s)&&(s.u==='all'||q.u===s.u); });
    startQuiz(buildSet(pool,10)); return;
  }
  else if(a==='reviewgo'){ startQuiz(buildSet(wrongList(),10)); return; }
  else if(a==='pick'||a==='submit'){
    if(z.given!==null) return;
    var q=z.items[z.i], g;
    if(a==='pick') g=z.opts[+v]; else { var inp=curInput(); g=inp?inp.value.trim():''; if(!g) return; }
    z.given=g; z.right=isRight(q,g);
    S.log.push({d:dkey(new Date()),id:q.id,ok:z.right?1:0}); save(); scheduleSync();
    if(z.right) z.ok++; else z.miss.push(q);
  }
  else if(a==='next'){
    if(z.i>=z.items.length-1){ st8.mode='result'; } else { z.i++; prepOpts(); }
    render(); window.scrollTo(0,0); return;
  }
  else if(a==='quit'){ st8.mode=null; try{ if(ttsOK) speechSynthesis.cancel(); }catch(e){} }
  else if(a==='key'){
    var inp2=curInput(); if(!inp2||inp2.disabled) return;
    if(v==='bs') inp2.value=inp2.value.slice(0,-1); else if(v==='clr') inp2.value=''; else inp2.value+=v;
    if(st8.mode==='mock'){ m.ans[m.ids[m.i]]=inp2.value.trim(); saveMock(); var nb=document.querySelectorAll('.qgrid button')[m.i]; if(nb) nb.classList.toggle('done',!!m.ans[m.ids[m.i]]); }
    return;
  }
  else if(a==='play'){
    var pq=BYID[v];
    if(st8.mode==='mock'){ if((m.plays[v]||0)>=2) return; m.plays[v]=(m.plays[v]||0)+1; saveMock(); playAudio(pq); render(); var st=document.getElementById('audst'); if(st) st.textContent='再生中…'; return; }
    playAudio(pq); return;
  }
  else if(a==='padundo'){ st8.pad.pop(); padRedraw(); return; }
  else if(a==='padclear'){ st8.pad.length=0; padRedraw(); return; }
  else if(a==='gplus'){ S.goal=Math.min(50,(S.goal||10)+5); save(); }
  else if(a==='gminus'){ S.goal=Math.max(5,(S.goal||10)-5); save(); }
  else if(a==='reset'){ st8.confirmReset=true; }
  else if(a==='resetno'){ st8.confirmReset=false; }
  else if(a==='resetyes'){ S={log:[],goal:S.goal||10,mocks:[],rank:S.rank}; save(); st8.confirmReset=false; }
  /* 模擬テスト */
  else if(a==='mockintro'){ st8.mockS=v; st8.mode='mockintro'; }
  else if(a==='mstart'){ st8.mock=buildMock(st8.mockS); saveMock(); st8.mode='mock'; st8.confirmSubmit=false; startTimer(); render(); window.scrollTo(0,0); return; }
  else if(a==='mresume'){
    var sm=loadMock(); if(!sm) return;
    st8.mock={s:sm.s,ids:sm.ids,secs:sm.secs,opts:sm.opts,ans:sm.ans||{},i:sm.i||0,plays:sm.plays||{},pads:{},startAt:sm.startAt,endAt:sm.endAt};
    if(Date.now()>=sm.endAt){ finishMock(); return; }
    st8.mode='mock'; st8.confirmSubmit=false; startTimer(); render(); window.scrollTo(0,0); return;
  }
  else if(a==='mdiscard'){ clearMock(); }
  else if(a==='mpick'){ var id=m.ids[m.i]; m.ans[id]=m.opts[id][+v]; saveMock(); }
  else if(a==='mgo'||a==='mnext'||a==='mprev'){
    var ni=a==='mgo'?+v:(a==='mnext'?m.i+1:m.i-1);
    if(ni<0||ni>=m.ids.length) return;
    try{ if(ttsOK) speechSynthesis.cancel(); }catch(e){}
    m.i=ni; st8.confirmSubmit=false; saveMock(); render(); window.scrollTo(0,0); return;
  }
  else if(a==='msubmit'){ st8.confirmSubmit=true; }
  else if(a==='mback'){ st8.confirmSubmit=false; }
  else if(a==='mfinish'){ finishMock(); return; }
  else if(a==='gorev'){ st8.mode=null; st8.tab='review'; }
  render();
});
render();

</script></body></html>
