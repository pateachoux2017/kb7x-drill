<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style>
/* Layout: 方眼ノート風の一列レイアウト。スマホ縦持ち前提、下にタブバー。 */
:root{
  --bg:#F2F5FB; --grid:#DCE3F2; --card:#FFFFFF; --ink:#18264A; --ink2:#5A678A; --line:#CBD3E8;
  --blue:#2F5BEA; --blue-ink:#FFFFFF; --mark:#FFD84A; --mark-ink:#18264A;
  --good:#17895D; --good-bg:#E3F5EC; --bad:#CF3F38; --bad-bg:#FCE9E7;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162B; --grid:#1B2442; --card:#192142; --ink:#E9EDFA; --ink2:#9BA7C9; --line:#2D3963;
    --blue:#8AA4FF; --blue-ink:#0F1630; --mark:#F2CB3F; --mark-ink:#10162B;
    --good:#4FD1A0; --good-bg:#12372D; --bad:#FF8A82; --bad-bg:#40201F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10162B; --grid:#1B2442; --card:#192142; --ink:#E9EDFA; --ink2:#9BA7C9; --line:#2D3963;
  --blue:#8AA4FF; --blue-ink:#0F1630; --mark:#F2CB3F; --mark-ink:#10162B;
  --good:#4FD1A0; --good-bg:#12372D; --bad:#FF8A82; --bad-bg:#40201F; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.7;
  padding-inline:16px; padding-block:16px 104px;
}
.app{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:26px;font-weight:900}
h2{font-size:19px;font-weight:900}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%);padding-inline:2px}
.sub{color:var(--ink2);font-size:13px;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--blue);color:var(--blue-ink);font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.bar{height:12px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mark);border-radius:99px;transition:width .4s}
.bar.blue>i{background:var(--blue)}
.big{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.subj .name{font-family:var(--f-disp);font-weight:900;font-size:22px}
.subj .pct{font-family:var(--f-num);font-size:13px;color:var(--ink2)}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qcard{padding:20px 18px}
.qtext{font-size:19px;font-weight:700;line-height:1.7;margin:8px 0 0;overflow-wrap:anywhere}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.ch .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:14px;font-weight:700}
.ch span.t{min-width:0;overflow-wrap:anywhere}
.ch.ok{border-color:var(--good);background:var(--good-bg)}
.ch.ok .k{background:var(--good);border-color:var(--good);color:var(--bg)}
.ch.ng{border-color:var(--bad);background:var(--bad-bg)}
.ch.ng .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.ch:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--good-bg);border:1.5px solid var(--good)}
.fb.ng{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fb b{font-family:var(--f-disp);font-size:17px}
.fb p{margin:6px 0 0;font-size:14px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:flex;gap:4px;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink2)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--blue);background:var(--grid)}
.badge{background:var(--bad);color:var(--bg);border-radius:99px;font-family:var(--f-num);font-size:11px;padding:0 6px;margin-left:4px}
/* lists */
details.rv{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
details.rv summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}
details.rv .ans{margin:8px 0 0;color:var(--good);font-weight:700}
details.rv .ex{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.urow{display:grid;grid-template-columns:5.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:14px}
.urow .v{text-align:right;font-family:var(--f-num);font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--ink2);padding:28px 12px}
svg text{font-family:var(--f-num);font-size:10px;fill:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* メモ用紙 */
.pad{display:flex;flex-direction:column;gap:8px}
.pad .tools{display:flex;gap:8px;align-items:center}
.pad .tools .chip{padding:5px 12px}
.sheet{background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 32px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sheet canvas{display:block;width:100%;height:280px;touch-action:none;color:var(--ink);cursor:crosshair}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.passage{white-space:pre-line;font-size:15px;line-height:1.85;overflow-wrap:anywhere;margin:0}
.qtext{white-space:pre-line}
.aud{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ansbox{width:100%;font-family:var(--f-num);font-size:26px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:right;min-height:56px}
.ansbox:disabled{opacity:1}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.keypad button{padding:14px 0;font-family:var(--f-num);font-size:20px;font-weight:600;border:1.5px solid var(--line);background:var(--card);border-radius:12px}
.keypad button.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-family:var(--f-body);font-size:15px}
.keypad button.sm{font-family:var(--f-body);font-size:14px}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.timer{font-family:var(--f-num);font-size:24px;font-weight:600}
.timer.warn{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{padding:8px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--f-num);font-size:14px}
.qgrid button.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qgrid button.cur{outline:3px solid var(--blue);outline-offset:1px}
.ch.sel{border-color:var(--blue);background:var(--grid)}
.ch.sel .k{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.tabs[hidden]{display:none}
.sec{font-family:var(--f-disp);font-weight:900;font-size:15px}
.mk{font-family:var(--f-num);font-weight:600}
.mk.ok{color:var(--good)}.mk.ng{color:var(--bad)}
.hist{display:grid;grid-template-columns:5em 3.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:14px}
.notice{background:var(--grid);border-radius:10px;padding:10px 12px;font-size:13px}
.rkrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.rkrow.you{border-color:var(--blue);background:var(--grid)}
.rkn{font-family:var(--f-num);font-weight:600;text-align:center;border-radius:8px;padding:2px 0}
.rkn.t{background:var(--mark);color:var(--mark-ink)}
.rkname{overflow-wrap:anywhere;font-weight:500}
.rkv{font-size:18px;font-weight:600}
.rkv small{font-size:12px;color:var(--ink2);margin-left:2px;font-weight:400}
.tab[hidden]{display:none}
.grid2>:last-child:nth-child(odd){grid-column:1/-1}
</style></head><body>

=3, 5"]}, {"s": "math", "u": "方程式", "q": "二次方程式 x²−8x+12=0 を解け。", "t": "mc", "a": "x=2, 6", "ex": "左辺を因数分解すると (x−6)(x−2)。よって x=2, 6。", "w": ["x=−6, −2", "x=−6, 2", "x=−2, 6"]}, {"s": "math", "u": "方程式", "q": "二次方程式 x²=7 を解け。", "t": "mc", "a": "x=±√7", "ex": "平方根を考えると x=√7 と x=−√7。両方答えます。", "w": ["x=√7", "x=±7", "x=±7/2"]}, {"s": "math", "u": "方程式", "q": "二次方程式 (x−3)²=25 を解け。", "t": "mc", "a": "x=8, −2", "ex": "x−3=±5。x=3+5=8、x=3−5=−2。", "w": ["x=8", "x=28, −22", "x=−8, 2"]}, {"s": "math", "u": "方程式", "q": "二次方程式 x²+3x−1=0 を解の公式で解け。", "t": "mc", "a": "x=(−3±√13)/2", "ex": "解の公式 x=(−b±√(b²−4ac))/2a に a=1, b=3, c=−1 を代入。b²−4ac=9+4=13。", "w": ["x=(3±√13)/2", "x=(−3±√5)/2", "x=(−3±√13)/4"]}, {"s": "math", "u": "方程式", "q": "二次方程式 x²−5x=0 を解け。", "t": "mc", "a": "x=0, 5", "ex": "x(x−5)=0 と因数分解できるので x=0 または x=5。x=0 を忘れずに。", "w": ["x=5", "x=0, −5", "x=±5"]}, {"s": "math", "u": "方程式", "q": "二次方程式 x²+ax−12=0 の解の1つが 2 であるとき、a の値を答えよ。", "t": "num", "a": "4", "ex": "x=2 を代入すると 4+2a−12=0。2a=8 より a=4。"}, {"s": "math", "u": "方程式", "q": "ノート3冊とペン2本で 660 円、ノート2冊とペン4本で 840 円である。ノート1冊の値段は何円か。", "t": "num", "a": "120", "ex": "ノート1冊を x 円、ペン1本を y 円とすると 3x+2y=660、2x+4y=840。解くと x=120、y=150。", "wp": true}, {"s": "math", "u": "方程式", "q": "A地点からB地点まで往復した。行きは分速60m、帰りは分速80mで歩き、往復で合計 14 分かかった。AB間の道のりは何mか。", "t": "num", "a": "480", "ex": "道のりを x m とすると x/60+x/80=14。両辺を240倍して 4x+3x=3360、x=480。", "wp": true}, {"s": "math", "u": "方程式", "q": "連続する3つの整数の和が 69 である。この3つの整数のうち最も小さい数を答えよ。", "t": "num", "a": "22", "ex": "真ん中の数は 69÷3=23。よって 22, 23, 24。最も小さい数は 22。", "wp": true}, {"s": "math", "u": "方程式", "q": "ある商品を定価の2割引で買ったところ、代金は 1440 円だった。定価は何円か。", "t": "num", "a": "1800", "ex": "定価を x 円とすると 0.8x=1440。x=1800。", "wp": true}, {"s": "math", "u": "方程式", "q": "連続する2つの正の整数の積が 156 である。大きい方の整数を答えよ。", "t": "num", "a": "13", "ex": "小さい方を x とすると x(x+1)=156。x²+x−156=0、(x+13)(x−12)=0。x は正なので x=12。大きい方は 13。", "wp": true}, {"s": "math", "u": "確率・データ", "q": "大小2つのさいころを同時に投げるとき、出る目の和が 5 になる確率を求めよ。（既約分数で答える）", "t": "num", "a": "1/9", "ex": "目の出方は全部で36通り。和が 5 になるのは 4 通り。確率は 1/9。"}, {"s": "math", "u": "確率・データ", "q": "大小2つのさいころを同時に投げるとき、出る目の和が 8 になる確率を求めよ。（既約分数で答える）", "t": "num", "a": "5/36", "ex": "目の出方は全部で36通り。和が 8 になるのは 5 通り。確率は 5/36。"}, {"s": "math", "u": "確率・データ", "q": "大小2つのさいころを同時に投げるとき、出る目の積が偶数になる確率を求めよ。（既約分数で答える）", "t": "num", "a": "3/4", "ex": "積が奇数になるのは2つとも奇数のとき 3×3=9 通り。偶数は 36−9=27 通り。確率は 3/4。"}, {"s": "math", "u": "確率・データ", "q": "赤玉3個、白玉2個が入った袋から、同時に2個の玉を取り出すとき、2個とも赤玉である確率を求めよ。（既約分数で答える）", "t": "num", "a": "3/10", "ex": "取り出し方は全部で 10 通り。2個とも赤玉は 3 通り。確率は 3/10。"}, {"s": "math", "u": "確率・データ", "q": "赤玉4個、白玉3個が入った袋から、同時に2個の玉を取り出すとき、2個とも赤玉である確率を求めよ。（既約分数で答える）", "t": "num", "a": "2/7", "ex": "取り出し方は全部で 21 通り。2個とも赤玉は 6 通り。確率は 2/7。"}, {"s": "math", "u": "確率・データ", "q": "1から5までの数字が1つずつ書かれた5枚のカードから、同時に2枚を引くとき、2枚の数の和が偶数になる確率を求めよ。（既約分数で答える）", "t": "num", "a": "2/5", "ex": "引き方は全部で 10 通り。和が偶数になるのは (1,3)(1,5)(3,5)(2,4) の 4 通り。確率は 2/5。"}, {"s": "math", "u": "確率・データ", "q": "1枚のコインを3回投げるとき、表がちょうど2回出る確率を求めよ。（既約分数で答える）", "t": "num", "a": "3/8", "ex": "全部で 2×2×2=8 通り。表がちょうど2回は (表表裏)(表裏表)(裏表表) の3通り。確率は 3/8。"}, {"s": "math", "u": "確率・データ", "q": "6個のデータ 4, 7, 9, 5, 8, 9 の平均値を答えよ。", "t": "num", "a": "7", "ex": "合計は 42。42÷6=7。"}, {"s": "math", "u": "確率・データ", "q": "データ 12, 5, 9, 15, 7, 11 の中央値を答えよ。", "t": "num", "a": "10", "ex": "小さい順に 5,7,9,11,12,15。真ん中の2つ 9 と 11 の平均が中央値で 10。"}, {"s": "math", "u": "確率・データ", "q": "データ 3, 5, 5, 6, 8, 5, 9 の最頻値（モード）を答えよ。", "t": "num", "a": "5", "ex": "5が3回出てくるので最頻値は 5。"}, {"s": "math", "u": "確率・データ", "q": "データ 2, 4, 5, 7, 8, 10, 12, 13 の四分位範囲を答えよ。", "t": "num", "a": "6.5", "ex": "下位4個の中央値（第1四分位数）は (4+5)/2=4.5、上位4個の中央値（第3四分位数）は (10+12)/2=11。四分位範囲は 11−4.5=6.5。"}, {"s": "math", "u": "確率・データ", "q": "5人の数学の平均点は 60 点だった。ここにもう1人 72 点の生徒を加えると、6人の平均点は何点になるか。", "t": "num", "a": "62", "ex": "5人の合計は 60×5=300。72点を加えて 372。372÷6=62。"}, {"s": "math", "u": "確率・データ", "q": "ある階級の度数が 12 で、度数の合計が 40 である。この階級の相対度数を答えよ。", "t": "num", "a": "0.3", "ex": "相対度数=その階級の度数÷度数の合計=12÷40=0.3。"}, {"s": "math", "u": "関数", "q": "2点 (1, −1), (4, 5) を通る直線の式を求めよ。", "t": "mc", "a": "y=2x−3", "ex": "傾きは (5−(−1))÷(4−1)=2。点 (1, −1) を通るので切片は −3。答えは y=2x−3。", "w": ["y=−2x−3", "y=2x+3", "y=2x−2"]}, {"s": "math", "u": "関数", "q": "2点 (−2, 7), (3, 2) を通る直線の式を求めよ。", "t": "mc", "a": "y=−x+5", "ex": "傾きは (2−7)÷(3−(−2))=−1。点 (−2, 7) を通るので切片は 5。答えは y=−x+5。", "w": ["y=x+5", "y=−x−5", "y=−x+6"]}, {"s": "math", "u": "関数", "q": "一次関数 y=−3x+2 で、x の値が 1 から 5 まで増加するとき、y の増加量を答えよ。", "t": "num", "a": "-12", "ex": "増加量=変化の割合×x の増加量=(−3)×4=−12。"}, {"s": "math", "u": "関数", "q": "一次関数 y=−2x+1 で、x の変域が −1≦x≦3 のとき、y の変域は？", "t": "mc", "a": "−5≦y≦3", "ex": "x=−1 のとき y=3、x=3 のとき y=−5。傾きが負なので小さい方から書いて −5≦y≦3。", "w": ["3≦y≦−5", "−1≦y≦7", "−5≦y≦7"]}, {"s": "math", "u": "関数", "q": "y は x に反比例し、x=3 のとき y=8 である。x=6 のとき y の値を答えよ。", "t": "num", "a": "4", "ex": "xy=3×8=24 で一定。x=6 なら y=24÷6=4。"}, {"s": "math", "u": "関数", "q": "2直線 y=x+1 と y=−2x+7 の交点の座標を求めよ。", "t": "mc", "a": "(2, 3)", "ex": "x+1=−2x+7 を解くと x=2。y=3。", "w": ["(3, 2)", "(−2, 3)", "(2, −3)"]}, {"s": "math", "u": "関数", "q": "関数 y=(1/2)x² のグラフ上に点Aがあり、Aのx座標は −4 である。Aのy座標を求めよ。", "t": "num", "a": "8", "ex": "x=−4 を代入。y=(1/2)×(−4)²=8。"}, {"s": "math", "u": "関数", "q": "関数 y=(1/3)x² のグラフ上に点Aがあり、Aのx座標は −3 である。Aのy座標を求めよ。", "t": "num", "a": "3", "ex": "x=−3 を代入。y=(1/3)×(−3)²=3。"}, {"s": "math", "u": "関数", "q": "関数 y=ax² のグラフが点 (8, 16) を通るとき、a の値を答えよ。", "t": "num", "a": "1/4", "ex": "x=8, y=16 を代入すると 16=a×64。a=1/4。"}, {"s": "math", "u": "関数", "q": "関数 y=ax² のグラフが点 (3, 18) を通るとき、a の値を答えよ。", "t": "num", "a": "2", "ex": "x=3, y=18 を代入すると 18=a×9。a=2。"}, {"s": "math", "u": "関数", "q": "関数 y=(1/2)x² で、x の値が 2 から 6 まで増加するときの変化の割合を求めよ。", "t": "num", "a": "4", "ex": "y=ax² で x が p から q まで変化するときの変化の割合は a(p+q)。1/2×(2+6)=4。"}, {"s": "math", "u": "関数", "q": "関数 y=3x² で、x の値が −2 から 1 まで増加するときの変化の割合を求めよ。", "t": "num", "a": "-3", "ex": "y=ax² で x が p から q まで変化するときの変化の割合は a(p+q)。3×(−2+1)=−3。"}, {"s": "math", "u": "関数", "q": "関数 y=(1/2)x² で、x の変域が −2≦x≦4 のとき、y の変域は？", "t": "mc", "a": "0≦y≦8", "ex": "x=0 を含むので最小値は 0。最大値は x=4 のとき 8。よって 0≦y≦8。", "w": ["2≦y≦8", "0≦y≦2", "8≦y≦2"]}, {"s": "math", "u": "関数", "q": "関数 y=x² で、x の変域が 1≦x≦3 のとき、y の変域は？", "t": "mc", "a": "1≦y≦9", "ex": "x≧0 の範囲では x が増えると y も増えます。x=1 で y=1、x=3 で y=9。", "w": ["0≦y≦9", "9≦y≦1", "1≦y≦3"]}, {"s": "math", "u": "関数", "q": "放物線 y=(1/2)x² 上に2点A, Bがあり、x座標はそれぞれ −2, 4 である。直線ABの式を求めよ。", "t": "mc", "a": "y=x+4", "ex": "A(−2, 2), B(4, 8)。傾きは (8−2)÷(4−(−2))=1。切片は 4。答えは y=x+4。", "w": ["y=−x+4", "y=x−4", "y=2x+4"]}, {"s": "math", "u": "関数", "q": "放物線 y=x² 上に2点A, Bがあり、x座標はそれぞれ −3, 2 である。直線ABの式を求めよ。", "t": "mc", "a": "y=−x+6", "ex": "A(−3, 9), B(2, 4)。傾きは (4−9)÷(2−(−3))=−1。切片は 6。答えは y=−x+6。", "w": ["y=x+6", "y=−x−6", "y=6"]}, {"s": "math", "u": "関数", "q": "放物線 y=(1/2)x² 上に2点A, Bがあり、x座標はそれぞれ −2, 4 である。原点をOとするとき、△OAB の面積を求めよ。", "t": "num", "a": "12", "ex": "直線ABとy軸の交点をCとすると C(0, 4)。△OAB=△OAC+△OBC=(1/2)×4×(2+4)=12。"}, {"s": "math", "u": "関数", "q": "放物線 y=x² 上に2点A, Bがあり、x座標はそれぞれ −2, 3 である。原点をOとするとき、△OAB の面積を求めよ。", "t": "num", "a": "15", "ex": "直線ABとy軸の交点をCとすると C(0, 6)。△OAB=△OAC+△OBC=(1/2)×6×(2+3)=15。"}, {"s": "math", "u": "関数", "q": "関数 y=ax² で、x=4 のとき y=4 である。x=6 のとき y の値を求めよ。", "t": "num", "a": "9", "ex": "x=4, y=4 を代入すると a=1/4。x=6 のとき y=(1/4)×36=9。"}, {"s": "math", "u": "関数", "q": "関数 y=ax² で、x=−3 のとき y=6 である。x=6 のとき y の値を求めよ。", "t": "num", "a": "24", "ex": "x=−3, y=6 を代入すると 6=9a、a=2/3。x=6 のとき y=(2/3)×36=24。"}, {"s": "math", "u": "図形", "q": "直角をはさむ2辺の長さが 6cm と 8cm の直角三角形がある。斜辺の長さを求めよ。（単位 cm）", "t": "num", "a": "10", "ex": "三平方の定理より 6²+8²=100。斜辺は √100=10。"}, {"s": "math", "u": "図形", "q": "斜辺が 17cm、他の1辺が 8cm の直角三角形がある。残りの辺の長さを求めよ。（単位 cm）", "t": "num", "a": "15", "ex": "17²−8²=289−64=225。√225=15。"}, {"s": "math", "u": "図形", "q": "縦 5cm、横 12cm の長方形の対角線の長さを求めよ。（単位 cm）", "t": "num", "a": "13", "ex": "対角線は直角三角形の斜辺。5²+12²=169、√169=13。"}, {"s": "math", "u": "図形", "q": "半径 5cm の円で、中心Oからの距離が 3cm である弦ABの長さを求めよ。（単位 cm）", "t": "num", "a": "8", "ex": "中心から弦に垂線を引くと弦の中点を通る。半弦=√(5²−3²)=4。弦ABは 4×2=8。"}, {"s": "math", "u": "図形", "q": "座標平面上の2点 A(1, 2), B(7, 10) の間の距離を求めよ。", "t": "num", "a": "10", "ex": "横に 6、縦に 8 離れている。三平方の定理で √(36+64)=10。"}, {"s": "math", "u": "図形", "q": "正八角形の1つの内角の大きさは何度か。", "t": "num", "a": "135", "ex": "八角形の内角の和は 180×(8−2)=1080°。÷8=135°。"}, {"s": "math", "u": "図形", "q": "十角形の内角の和は何度か。", "t": "num", "a": "1440", "ex": "内角の和は 180×(n−2)。180×8=1440°。"}, {"s": "math", "u": "図形", "q": "1つの外角が 36° である正多角形は正何角形か。", "t": "num", "a": "10", "ex": "外角の和は 360°。360÷36=10。正十角形。"}, {"s": "math", "u": "図形", "q": "円Oの円周上に3点A, B, Cがある。弧ABに対する中心角∠AOBが 130° のとき、円周角∠ACBは何度か。（Cは弧ABを含まない側の円周上の点）", "t": "num", "a": "65", "ex": "円周角は中心角の半分。130÷2=65°。"}, {"s": "math", "u": "図形", "q": "円の弧ABに対する円周角が 38° のとき、中心角∠AOBは何度か。", "t": "num", "a": "76", "ex": "中心角は円周角の2倍。38×2=76°。"}, {"s": "math", "u": "図形", "q": "円に内接する四角形ABCDで、∠A=105° のとき ∠C は何度か。", "t": "num", "a": "75", "ex": "円に内接する四角形の対角の和は 180°。180−105=75°。"}, {"s": "math", "u": "図形", "q": "半径 6cm、中心角 60° のおうぎ形の弧の長さは □π cm である。□にあてはまる数を求めよ。", "t": "num", "a": "2", "ex": "弧の長さ=2π×6×(60/360)=2π。"}, {"s": "math", "u": "図形", "q": "半径 6cm、中心角 150° のおうぎ形の面積は □π cm² である。□にあてはまる数を求めよ。", "t": "num", "a": "15", "ex": "面積=π×6²×(150/360)=36×(5/12)π=15π。"}, {"s": "math", "u": "図形", "q": "底面の半径が 3cm、高さが 5cm の円柱の体積は □π cm³ である。□にあてはまる数を求めよ。", "t": "num", "a": "45", "ex": "体積=底面積×高さ=π×3²×5=45π。"}, {"s": "math", "u": "図形", "q": "底面の半径が 3cm、高さが 4cm の円錐の体積は □π cm³ である。□にあてはまる数を求めよ。", "t": "num", "a": "12", "ex": "体積=(1/3)×底面積×高さ=(1/3)×9π×4=12π。"}, {"s": "math", "u": "図形", "q": "半径 3cm の球の体積は □π cm³ である。□にあてはまる数を求めよ。", "t": "num", "a": "36", "ex": "球の体積=(4/3)πr³=(4/3)π×27=36π。"}, {"s": "math", "u": "図形", "q": "半径 5cm の球の表面積は □π cm² である。□にあてはまる数を求めよ。", "t": "num", "a": "100", "ex": "球の表面積=4πr²=4π×25=100π。"}, {"s": "math", "u": "図形", "q": "底面が1辺6cmの正方形で、高さが 5cm の正四角錐の体積は何 cm³ か。", "t": "num", "a": "60", "ex": "体積=(1/3)×底面積×高さ=(1/3)×36×5=60。"}, {"s": "math", "u": "図形", "q": "相似比が 2:3 である2つの三角形がある。小さい方の面積が 12cm² のとき、大きい方の面積は何 cm² か。", "t": "num", "a": "27", "ex": "面積比は相似比の2乗で 4:9。12×(9/4)=27。"}, {"s": "math", "u": "図形", "q": "相似比が 1:2 である2つの立体がある。小さい方の体積が 15cm³ のとき、大きい方の体積は何 cm³ か。", "t": "num", "a": "120", "ex": "体積比は相似比の3乗で 1:8。15×8=120。"}, {"s": "math", "u": "図形", "q": "△ABC の辺 AB, AC の中点をそれぞれ M, N とする。BC=14cm のとき、MN の長さは何 cm か。", "t": "num", "a": "7", "ex": "中点連結定理より MN=BC÷2=7。"}, {"s": "math", "u": "図形", "q": "AB=AC の二等辺三角形ABCで、頂角∠A=48° のとき、底角∠B は何度か。", "t": "num", "a": "66", "ex": "底角は等しいので (180−48)÷2=66°。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "attend の意味はどれ？", "a": "出席する", "w": ["手伝う", "比べる", "祝う"], "ex": "attend は「出席する」。attend a meeting（会議に出る）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "tradition の意味はどれ？", "a": "伝統", "w": ["革命", "経験", "競争"], "ex": "tradition は「伝統」。形容詞は traditional（伝統的な）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "especially の意味はどれ？", "a": "特に", "w": ["ほとんど", "まだ", "たぶん"], "ex": "especially は「特に」。I like fruit, especially apples."}, {"s": "eng", "u": "単語", "t": "mc", "q": "century の意味はどれ？", "a": "世紀", "w": ["世代", "季節", "地域"], "ex": "century は「100年、世紀」。the 21st century（21世紀）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "customer の意味はどれ？", "a": "客", "w": ["従業員", "隣人", "医者"], "ex": "customer は店などの「客」。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "popular の意味はどれ？", "a": "人気のある", "w": ["静かな", "昔の", "不思議な"], "ex": "popular は「人気のある」。popular among young people（若者に人気）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "pleased の意味はどれ？", "a": "うれしい", "w": ["疲れた", "怒った", "心配な"], "ex": "pleased は「うれしい、喜んで」。I'm pleased to meet you."}, {"s": "eng", "u": "単語", "t": "mc", "q": "suddenly の意味はどれ？", "a": "突然", "w": ["次第に", "最近", "いつも"], "ex": "suddenly は「突然」。形容詞は sudden。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "invite の意味はどれ？", "a": "招待する", "w": ["禁止する", "断る", "手配する"], "ex": "invite は「招待する」。invite her to the party。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "wonderful の意味はどれ？", "a": "すばらしい", "w": ["恐ろしい", "退屈な", "普通の"], "ex": "wonderful は「すばらしい」。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "shy の意味はどれ？", "a": "恥ずかしがりの", "w": ["勇敢な", "忙しい", "賢い"], "ex": "shy は「内気な、恥ずかしがりの」。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "culture の意味はどれ？", "a": "文化", "w": ["自然", "産業", "歴史"], "ex": "culture は「文化」。different cultures（さまざまな文化）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "次の説明にあてはまる語はどれ？　\"a place where you can borrow books\"", "a": "library", "w": ["hospital", "museum", "station"], "ex": "borrow books（本を借りる）場所なので library（図書館）。"}, {"s": "eng", "u": "単語", "t": "mc", "q": "次の説明にあてはまる語はどれ？　\"the season after summer\"", "a": "autumn", "w": ["spring", "winter", "rainy"], "ex": "夏の次の季節は autumn（fall）。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "I was（　）the news when the phone rang.", "a": "watching", "w": ["watch", "watched", "to watch"], "ex": "「電話が鳴ったとき〜を見ていた」は過去進行形 was＋ing。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "My brother is（　）than me.", "a": "taller", "w": ["tall", "tallest", "more tall"], "ex": "than があるので比較級。tall の比較級は taller。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "How many books（　）you read last month?", "a": "did", "w": ["do", "were", "have"], "ex": "last month（先月）は過去を表すので疑問文は did を使います。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "She asked me（　）the station was.", "a": "where", "w": ["what", "who", "which"], "ex": "間接疑問文。「駅がどこにあるか」なので where。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "The window（　）by Tom yesterday.", "a": "was broken", "w": ["broke", "broken", "is breaking"], "ex": "「割られた」は受け身。yesterday なので was＋過去分詞。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "I have（　）finished my homework.", "a": "already", "w": ["yet", "ago", "ever"], "ex": "現在完了の肯定文で「もう〜した」は already。yet は否定文・疑問文で使います。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "This is the picture（　）I took in Kyoto.", "a": "that", "w": ["who", "what", "whose"], "ex": "先行詞が the picture（物）なので that（または which）。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "He was too tired（　）walk.", "a": "to", "w": ["for", "of", "with"], "ex": "too ～ to ... で「～すぎて…できない」。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "Please tell me how（　）get to the museum.", "a": "to", "w": ["will", "going", "for"], "ex": "how to ～ で「～のしかた」。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "If I（　）a bird, I could fly to you.", "a": "were", "w": ["am", "be", "will be"], "ex": "事実と異なる仮定（仮定法）では If I were ～ を使います。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "The girl（　）with Ken is my sister.", "a": "talking", "w": ["talk", "talked", "talks"], "ex": "「ケンと話している女の子」は現在分詞の後置修飾。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "Math is（　）difficult subject for me.", "a": "the most", "w": ["more", "most", "the more"], "ex": "「最も難しい教科」は最上級。difficult は the most difficult。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "I enjoyed（　）soccer with my friends.", "a": "playing", "w": ["to play", "play", "played"], "ex": "enjoy のあとは動名詞（～ing）。to ～ は使えません。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "It is important（　）us to help each other.", "a": "for", "w": ["of", "to", "with"], "ex": "It is ～ for 人 to ... で「人が…することは～だ」。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "（　）you open the window, please?", "a": "Could", "w": ["Do", "Are", "Is"], "ex": "Could you ～, please? は「～していただけますか」とていねいに頼む表現。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "Ken has lived in Tokyo（　）he was born.", "a": "since", "w": ["for", "during", "while"], "ex": "「生まれてからずっと」は起点を表す since。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "I wish I（　）more time.", "a": "had", "w": ["have", "has", "having"], "ex": "I wish のあとは仮定法過去。「もっと時間があればなあ」は had。"}, {"s": "eng", "u": "文法", "t": "mc", "q": "I was（　）in the story.", "a": "interested", "w": ["interesting", "interest", "interests"], "ex": "「（人が）興味を持った」は interested。interesting は「（物が）おもしろい」。"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "be interested in ～ の意味はどれ？", "a": "～に興味がある", "w": ["～に参加する", "～に驚く", "～が得意だ"], "ex": "I'm interested in science.（私は科学に興味があります）"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "as soon as ～ の意味はどれ？", "a": "～するとすぐに", "w": ["～するかぎり", "～する前に", "～のあいだに"], "ex": "as soon as I got home（家に着くとすぐに）"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "at least の意味はどれ？", "a": "少なくとも", "w": ["せいぜい", "とくに", "最後に"], "ex": "at least ten minutes（少なくとも10分）。反対は at most（多くても）。"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "run out of ～ の意味はどれ？", "a": "～を使い果たす", "w": ["～から逃げる", "～を運転する", "～を追いかける"], "ex": "We ran out of water.（水がなくなった）"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "wait for ～ の意味はどれ？", "a": "～を待つ", "w": ["～を見送る", "～を探す", "～を呼ぶ"], "ex": "wait for the bus（バスを待つ）。"}, {"s": "eng", "u": "熟語", "t": "mc", "q": "pick up ～ の意味はどれ？", "a": "～を拾う・迎えに行く", "w": ["～を捨てる", "～を飾る", "～を売る"], "ex": "I'll pick you up at the station.（駅まで迎えに行くよ）"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「私は京都を訪れたい。」という意味の正しい英文にするとき、正しいものはどれ？\n（I / want / to / Kyoto / visit）", "a": "I want to visit Kyoto.", "w": ["I visit want to Kyoto.", "To I want visit Kyoto.", "I want visit to Kyoto."], "ex": "want to ～（～したい）のあとに動詞 visit と目的語 Kyoto を置きます。"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「彼女は何を探していますか。」という意味の正しい英文にするとき、正しいものはどれ？\n（is / looking / what / for / she）", "a": "What is she looking for?", "w": ["What she is looking for?", "Is what she looking for?", "What is looking she for?"], "ex": "疑問詞 What＋is she looking for（進行形の疑問文の語順）。"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「これは私が昨日買った本です。」という意味の正しい英文にするとき、正しいものはどれ？\n（is / the book / this / bought / I / yesterday）", "a": "This is the book I bought yesterday.", "w": ["This the book is I bought yesterday.", "This is I bought the book yesterday.", "Yesterday this is bought the book I."], "ex": "the book のあとに I bought yesterday（関係代名詞の省略）が続きます。"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「駅への行き方を教えてください。」という意味の正しい英文にするとき、正しいものはどれ？\n（me / to / how / the station / tell / get / please）", "a": "Please tell me how to get to the station.", "w": ["Please tell me to how get to the station.", "Please how tell me to get to the station.", "Tell please me how to get the station to."], "ex": "tell 人 how to ～（～のしかたを教える）の形。"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「彼が来るかどうか私は知りません。」という意味の正しい英文にするとき、正しいものはどれ？\n（know / if / I / he / don't / will come）", "a": "I don't know if he will come.", "w": ["I know don't if he will come.", "I don't if know he will come.", "If he will come I know don't."], "ex": "「～かどうか」は if。I don't know のあとに if he will come を続けます。"}, {"s": "eng", "u": "並べ替え", "t": "mc", "q": "次の語（句）を並べかえて、「英語は世界中で話されています。」という意味の正しい英文にするとき、正しいものはどれ？\n（spoken / is / English / all over the world）", "a": "English is spoken all over the world.", "w": ["English spoken is all over the world.", "Is English spoken all over the world.", "English is all over spoken the world."], "ex": "受け身 is＋過去分詞（spoken）。場所を表す all over the world は最後。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Hi, Nick. You look tired.\nB: Yes. I stayed up late last night to finish my homework.\nA: （　） You should go to bed early today.", "a": "That's too bad.", "w": ["Congratulations!", "Here you are.", "I'm glad to hear that."], "ex": "宿題で夜更かしして疲れている相手への返事なので「それは大変だったね」That's too bad."}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Excuse me. How can I get to the city library?\nB: Go straight and turn left at the second corner. You'll see it on your right.\nA: （　）", "a": "Thank you very much. That's very helpful.", "w": ["No, I don't think so.", "It's mine.", "I'm sorry, I can't."], "ex": "道を教えてもらったお礼を言う場面です。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Would you like to go shopping with me tomorrow?\nB: （　） I have to take care of my little brother.", "a": "I'd love to, but I can't.", "w": ["Yes, let's go.", "Sure, here you are.", "No, I don't like him."], "ex": "後ろで「弟の世話をしなければならない」と断る理由を言っているので I'd love to, but I can't.（行きたいけれどだめなんだ）。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: How long have you lived in this town?\nB: （　）", "a": "For about ten years.", "w": ["Every year.", "About ten dollars.", "By train."], "ex": "How long ～? は期間をたずねる文。for ～ years と答えます。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Hello. This is Yuki. May I speak to Ms. Green?\nB: I'm sorry, she is out now. （　）", "a": "Would you like to leave a message?", "w": ["Can I take your order?", "Shall I speak to you?", "Where are you from?"], "ex": "電話で相手が不在のときの定番表現。伝言をうかがう Would you like to leave a message?"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: May I help you?\nB: I'm looking for a T-shirt.\nA: How about this blue one?\nB: （　） Do you have a bigger one?", "a": "It looks nice, but it's a little small.", "w": ["It's too big for me.", "I bought it yesterday.", "That's all, thank you."], "ex": "「もっと大きいものはありますか」とたずねているので、今見せられたものは小さいと言っているはず。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: What do you want to be in the future?\nB: I want to be a teacher.\nA: （　）", "a": "Why do you want to be one?", "w": ["How much is it?", "Where did you buy it?", "What time is it?"], "ex": "将来の夢を聞いたあとに、理由をたずねる自然な流れです。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: I'm going to watch the baseball game this weekend. Do you want to come?\nB: （　） What time does it start?", "a": "Sounds good.", "w": ["I'm afraid not.", "You're welcome.", "Never mind."], "ex": "そのあとに開始時間をたずねているので、前向きな返事 Sounds good.（いいね）。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Can you help me carry these books?\nB: （　）", "a": "Sure. Where should I put them?", "w": ["I'm sorry, I'm fine.", "No, thank you. I'm full.", "Yes, you can use it."], "ex": "手伝いを頼まれたときの返事です。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: I'm sorry I forgot your book.\nB: （　） You can bring it tomorrow.", "a": "Don't worry.", "w": ["You're welcome.", "Good luck.", "See you soon."], "ex": "あやまられたときは Don't worry.（気にしないで）。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Is this your first time in Japan?\nB: No, （　） I came here three years ago.", "a": "it's my second time.", "w": ["it's my first time.", "I don't like Japan.", "I'll come back soon."], "ex": "3年前にも来たので first time ではありません。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Are you ready to order?\nB: Yes. I'll have the pasta.\nA: Anything to drink?\nB: （　）", "a": "Orange juice, please.", "w": ["Yes, I did.", "It's delicious.", "I'm ready."], "ex": "飲み物をたずねられているので、飲み物を答えます。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Which do you like better, summer or winter?\nB: （　） I like swimming in the sea.", "a": "I like summer better.", "w": ["I like winter better.", "I don't swim.", "I like it a lot, too."], "ex": "海で泳ぐのが好きなので夏のほうが好きだとわかります。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: What's the matter?\nB: I have a headache.\nA: （　）", "a": "You should see a doctor.", "w": ["You're welcome.", "That sounds fun.", "Let's play soccer."], "ex": "頭が痛いと言う相手へのアドバイスです。"}, {"s": "eng", "u": "会話", "t": "mc", "q": "A: Could you tell me how to use this machine?\nB: （　） First, put your card in here.", "a": "Of course.", "w": ["I'm sorry I'm late.", "It's a long way.", "No, I haven't."], "ex": "使い方を聞かれて、そのあと説明を始めているので承諾の返事 Of course."}, {"s": "eng", "u": "長文", "t": "mc", "q": "Why did the writer not want to join the cleaning at first?", "a": "Because the writer was tired from basketball practice.", "w": ["Because the writer was sick.", "Because the writer had to study.", "Because the writer did not like the park."], "ex": "2文目に I did not want to join because I was tired from basketball practice. とあります。", "pid": "p1"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What made the writer happy?", "a": "The old man's words.", "w": ["A present from the teacher.", "The basketball game.", "The new school building."], "ex": "「その言葉が私をうれしくさせた」His words made me happy. の His words は老人の言葉。", "pid": "p1"}, {"s": "eng", "u": "長文", "t": "mc", "q": "Which is true about the writer?", "a": "The writer will join the cleaning again next month.", "w": ["The writer cleaned the park alone.", "The writer learned that basketball is important.", "The old man joined the cleaning with the writer."], "ex": "最後の文に Next month, I will join the cleaning again とあります。", "pid": "p1"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What is Emily planning for August 10?", "a": busy with the tennis club.", "pid": "p4"}, {"s": "eng", "u": "長文", "t": "mc", "q": "Where did the writer play the piano for the grandfather last winter?", "a": "In the lobby of the hospital.", "w": ["At the grandfather's house.", "At school.", "In the park."], "ex": "Last winter ... I played the piano for him in the lobby of the hospital.", "pid": "p4"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What does the writer do every weekend now?", "a": "The writer plays the piano for the grandfather at his home.", "w": ["The writer practices tennis.", "The writer visits the hospital.", "The writer teaches the piano."], "ex": "最後の文 Now I play the piano for him at his home every weekend.", "pid": "p4"}, {"s": "eng", "u": "長文", "t": "mc", "q": "How much is the camp?", "a": "12,000 yen, and food and the bus are included.", "w": ["12,000 yen, and food is not included.", "30,000 yen.", "It is free."], "ex": "Fee: 12,000 yen (food and bus are included)。", "pid": "p5"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What do the students need to bring?", "a": "A towel and a water bottle.", "w": ["Food and a bus ticket.", "A computer and a pen.", "A towel and lunch."], "ex": "You need to bring a towel and a water bottle.", "pid": "p5"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What should students do by July 10 if they want to join?", "a": "Call Ms. Brown.", "w": ["Pay 30,000 yen.", "Visit Green Hill.", "Send an e-mail to the camp site."], "ex": "please call Ms. Brown by July 10 とあります。", "pid": "p5"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What does the writer think about smartphones at school?", "a": "They are useful if students follow the rules.", "w": ["Students should never use them.", "Teachers should use them in class.", "They are more important than books."], "ex": "2〜3文目と最後の文から、ルールを守れば役に立つという意見です。", "pid": "p6"}, {"s": "eng", "u": "長文", "t": "mc", "q": "What does the writer use a dictionary app for?", "a": "To check new words.", "w": ["To check train times.", "To talk with friends.", "To take pictures."], "ex": "I use a dictionary app when I find new words とあります。", "pid": "p6"}, {"s": "eng", "u": "長文", "t": "mc", "q": "When should students NOT use smartphones, according to the writer?", "a": "During classes.", "w": ["On the way home.", "At lunch time.", "After school."], "ex": "Of course, we should not use them during classes.", "pid": "p6"}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "How will Tom go to Osaka?", "a": "By train.", "w": ["By bus.", "By car.", "By plane."], "ex": "放送文：A: Tom, what are you going to do this weekend? B: I'm going to visit my grandmother in Osaka. I'll go there by train. A: That sounds nice.", "au": [["A", "Tom, what are you going to do this weekend?"], ["B", "I'm going to visit my grandmother in Osaka. I'll go there by train."], ["A", "That sounds nice."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Where is the blue bag?", "a": "On the sofa.", "w": ["In her room.", "In the kitchen.", "On the desk."], "ex": "放送文：A: Mom, I can't find my blue bag. B: Did you look in your room? A: Yes, but it's not there. B: I saw it on the sofa in the living room.", "au": [["A", "Mom, I can't find my blue bag."], ["B", "Did you look in your room?"], ["A", "Yes, but it's not there."], ["B", "I saw it on the sofa in the living room."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "What time will they watch the movie?", "a": "At five thirty.", "w": ["At three.", "At five.", "At six thirty."], "ex": "放送文：A: Hello. I'd like two tickets for the three o'clock movie. B: I'm sorry. The three o'clock movie is full. The next one starts at five thirty. A: OK. Two tickets for the five thirty movie, please.", "au": [["A", "Hello. I'd like two tickets for the three o'clock movie."], ["B", "I'm sorry. The three o'clock movie is full. The next one starts at five thirty."], ["A", "OK. Two tickets for the five thirty movie, please."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Who helped Ken with math?", "a": "His sister.", "w": ["His mother.", "His teacher.", "His friend."], "ex": "放送文：A: Ken, you look happy today. B: Yes. I got one hundred points on the math test! A: That's great. Did you study hard? B: Yes. My sister helped me last night.", "au": [["A", "Ken, you look happy today."], ["B", "Yes. I got one hundred points on the math test!"], ["A", "That's great. Did you study hard?"], ["B", "Yes. My sister helped me last night."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Where will the students practice today?", "a": "In the gym.", "w": ["Outside.", "In the library.", "At the park."], "ex": "放送文：A: Good morning, everyone. This is Mr. Sato. Today it is rainy, so we will not have soccer practice outside. Please come to the gym at four o'clock and bring your indoor shoes. Thank you.", "au": [["A", "Good morning, everyone. This is Mr. Sato. Today it is rainy, so we will not have soccer practice outside. Please come to the gym at four o'clock and bring your indoor shoes. Thank you."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "What did Emi do in Hokkaido?", "a": "She made a snowman.", "w": ["She went skiing.", "She bought a coat.", "She visited her teacher."], "ex": "放送文：A: How was your trip to Hokkaido, Emi? B: It was great. I ate a lot of delicious seafood, but it was very cold. A: Did you see snow? B: Yes, I did. I made a snowman with my cousins.", "au": [["A", "How was your trip to Hokkaido, Emi?"], ["B", "It was great. I ate a lot of delicious seafood, but it was very cold."], ["A", "Did you see snow?"], ["B", "Yes, I did. I made a snowman with my cousins."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Until what time can the person who asks use the computer?", "a": "Seven fifty.", "w": ["Seven twenty.", "Eight.", "Eight thirty."], "ex": "放送文：A: Dad, can I use your computer? B: Sure, but I need it at eight. How long do you need it? A: About thirty minutes. I need to finish my report. B: OK. It's seven twenty now. You can use it until seven fifty.", "au": [["A", "Dad, can I use your computer?"], ["B", "Sure, but I need it at eight. How long do you need it?"], ["A", "About thirty minutes. I need to finish my report."], ["B", "OK. It's seven twenty now. You can use it until seven fifty."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Where is the post office?", "a": "Next to the bank.", "w": ["Next to the station.", "In front of the school.", "Behind the library."], "ex": "放送文：A: Excuse me. Is there a post office near here? B: Yes. Go straight for two blocks and turn right. It's next to the bank.", "au": [["A", "Excuse me. Is there a post office near here?"], ["B", "Yes. Go straight for two blocks and turn right. It's next to the bank."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "What does Aya do on Sundays?", "a": "She washes her dog.", "w": ["She walks with her dog.", "She gives food to her cats.", "She goes to school."], "ex": "放送文：A: Hi, I'm Aya. I have a dog and two cats. I take care of them every day. In the morning, I walk with my dog. After school, I give food to my cats. On Sundays, I wash my dog. I love my pets very much.", "au": [["A", "Hi, I'm Aya. I have a dog and two cats. I take care of them every day. In the morning, I walk with my dog. After school, I give food to my cats. On Sundays, I wash my dog. I love my pets very much."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Which club does Lisa want to join?", "a": "The art club.", "w": ["The basketball team.", "The music club.", "The science club."], "ex": "放送文：A: Which club are you going to join, Lisa? B: I want to join the art club, but my friend wants me to join the basketball team. A: What will you do? B: I'll talk to her. I like drawing more than sports.", "au": [["A", "Which club are you going to join, Lisa?"], ["B", "I want to join the art club, but my friend wants me to join the basketball team."], ["A", "What will you do?"], ["B", "I'll talk to her. I like drawing more than sports."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "When will they have lunch?", "a": "The day after tomorrow.", "w": ["Tomorrow.", "Today.", "Next week."], "ex": "放送文：A: Would you like to have lunch with me tomorrow? B: I'd love to, but I have a dentist appointment at noon. A: How about the day after tomorrow? B: That's fine.", "au": [["A", "Would you like to have lunch with me tomorrow?"], ["B", "I'd love to, but I have a dentist appointment at noon."], ["A", "How about the day after tomorrow?"], ["B", "That's fine."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "What will the two speakers do in the evening?", "a": "They will make dinner together.", "w": ["They will go to a meeting.", "They will buy a suit.", "They will eat at a restaurant."], "ex": "放送文：A: Dad, why are you wearing a suit today? B: I have an important meeting at work. A: Good luck! B: Thank you. I'll be back home at six, so let's make dinner together.", "au": [["A", "Dad, why are you wearing a suit today?"], ["B", "I have an important meeting at work."], ["A", "Good luck!"], ["B", "Thank you. I'll be back home at six, so let's make dinner together."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "When does the penguin show start?", "a": "At eleven.", "w": ["At nine.", "At two.", "At five."], "ex": "放送文：A: Welcome to Midori Zoo. The zoo opens at nine and closes at five. The penguin show starts at eleven, and the lions' feeding time is at two. Please don't give food to the animals. Enjoy your day!", "au": [["A", "Welcome to Midori Zoo. The zoo opens at nine and closes at five. The penguin show starts at eleven, and the lions' feeding time is at two. Please don't give food to the animals. Enjoy your day!"]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "What will the speaker who goes to the supermarket buy?", "a": "Some eggs.", "w": ["Some milk.", "Eggs and milk.", "Nothing."], "ex": "放送文：A: I'm going to the supermarket. Do you need anything? B: Can you buy some eggs and milk? We have no eggs. A: We still have milk, right? B: Oh, you're right. Just eggs, then.", "au": [["A", "I'm going to the supermarket. Do you need anything?"], ["B", "Can you buy some eggs and milk? We have no eggs."], ["A", "We still have milk, right?"], ["B", "Oh, you're right. Just eggs, then."]]}, {"s": "eng", "u": "リスニング", "t": "mc", "q": "Who will go to Australia with Jun?", "a": "Ryo.", "w": ["His brother.", "His teacher.", "Nobody."], "ex": "放送文：A: Hi, Jun. Do you have any plans for this summer vacation? B: I'm going to study English in Australia for two weeks. A: Wow! Are you going alone? B: No, my classmate Ryo is going with me.", "au": [["A", "Hi, Jun. Do you have any plans for this summer vacation?"], ["B", "I'm going to study English in Australia for two weeks."], ["A", "Wow! Are you going alone?"], ["B", "No, my classmate Ryo is going with me."]]}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「抽象」", "a": "ちゅうしょう", "w": ["ちゅうぞう", "ちゅうしょ", "ちょうしょう"], "ex": "「抽象」は「ちゅうしょう」。具体的でない、という意味です。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「概念」", "a": "がいねん", "w": ["がいわん", "きねん", "がんねん"], "ex": "「概念」は「がいねん」。物事の大まかな共通の考えのこと。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「把握」", "a": "はあく", "w": ["はわく", "ばあく", "はくあく"], "ex": "「把握」は「はあく」。しっかり理解すること。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「顕著」", "a": "けんちょ", "w": ["げんちょ", "けんじょ", "けんしょ"], "ex": "「顕著」は「けんちょ」。はっきりと目立つようす。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「妥協」", "a": "だきょう", "w": ["たきょう", "だこう", "だきょ"], "ex": "「妥協」は「だきょう」。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「貢献」", "a": "こうけん", "w": ["こうけい", "くけん", "こうげん"], "ex": "「貢献」は「こうけん」。役に立つこと。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「脅威」", "a": "きょうい", "w": ["きょうえい", "ごうい", "きょうがい"], "ex": "「脅威」は「きょうい」。おびやかすもの。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しいものを選べ。\n「懸念」", "a": "けねん", "w": ["けんねん", "かんねん", "けいねん"], "ex": "「懸念」は「けねん」。心配すること。「けんねん」と読まないように注意。"}, {"s": "jpn", "u": "漢字読み", "t": "mc", "q": "次の漢字の読みとして正しい る」は謙譲語です。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "次の文の（　）に入る敬語として最も適切なものはどれか。\n「私が先生に資料を（　）。」（「見せる」の謙譲語）", "a": "お見せする", "w": ["お見せになる", "ご覧になる", "お見せくださる"], "ex": "自分の動作は謙譲語「お～する」を使います。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "次の文の（　）に入る敬語として最も適切なものはどれか。\n「お客様が（　）。」（「来る」の尊敬語）", "a": "いらっしゃいました", "w": ["参りました", "伺いました", "いたしました"], "ex": "「来る」の尊敬語は「いらっしゃる」「お見えになる」。「参る」は謙譲語です。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "次の文の（　）に入る敬語として最も適切なものはどれか。\n「私が明日、お宅に（　）。」（「行く」の謙譲語）", "a": "伺います", "w": ["いらっしゃいます", "おいでになります", "行かれます"], "ex": "訪問するという謙譲語は「伺う」「参る」。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "「具体」の対義語（反対の意味の言葉）はどれか。", "a": "抽象", "w": ["実際", "部分", "一般"], "ex": "「具体」は形があって分かりやすいこと。反対は「抽象」。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "「需要」の対義語はどれか。", "a": "供給", "w": ["消費", "生産", "輸出"], "ex": "「需要」は買いたい量、「供給」は売りたい量。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "「案外」と最も意味が近い言葉はどれか。", "a": "意外", "w": ["当然", "もちろん", "決して"], "ex": "予想とちがうようすを表す言葉。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "「消極的」の対義語はどれか。", "a": "積極的", "w": ["否定的", "客観的", "悲観的"], "ex": "進んで行動するようす。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "熟語「登山」の構成として正しいものはどれか。", "a": "下の字が上の字の目的や対象を表す（山に登る）", "w": ["似た意味の漢字を重ねる", "反対の意味の漢字を重ねる", "上の字が下の字を修飾する"], "ex": "「～を（に）＋動詞」の関係。「読書」「植林」も同じ構成です。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "熟語「高低」の構成として正しいものはどれか。", "a": "反対の意味の漢字を重ねる", "w": ["似た意味の漢字を重ねる", "上の字が下の字を修飾する", "下の字が上の字の目的を表す"], "ex": "「高」と「低」は反対の意味。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "熟語「温暖」の構成として正しいものはどれか。", "a": "似た意味の漢字を重ねる", "w": ["反対の意味の漢字を重ねる", "上の字が下の字を修飾する", "下の字が上の字の目的を表す"], "ex": "「温」も「暖」も「あたたかい」という意味。"}, {"s": "jpn", "u": "語句", "t": "mc", "q": "熟語「青空」の構成として正しいものはどれか。", "a": "上の字が下の字を修飾する", "w": ["似た意味の漢字を重ねる", "反対の意味の漢字を重ねる", "下の字が上の字の目的を表す"], "ex": "「青い空」と読めるので、上が下を修飾。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の傍線部の「ない」のうち、助動詞であるものはどれか。", "a": "私は明日学校に行かない。", "w": ["今日はあまり寒くない。", "ここには誰もいない。", "この部屋は静かではない。"], "ex": "「行かない」は動詞「行く」に付いて否定を表す助動詞。「寒くない」「静かではない」は補助形容詞、「いない」は形容詞です。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の文の「れる」と同じ意味（尊敬）で使われているものはどれか。\n「先生が教室に来られる。」", "a": "校長先生が話される。", "w": ["昔のことが思い出される。", "この果物は生でも食べられる。", "犬にほえられた。"], "ex": "「話される」は動作をする人を敬う尊敬。他は順に自発・可能・受け身。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の文の「れる」の意味として正しいものはどれか。\n「故郷のことが思い出される。」", "a": "自発", "w": ["尊敬", "可能", "受け身"], "ex": "自然とそうなってしまう意味は自発。「しのばれる」「案じられる」なども同じ。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の文の「られる」の意味として正しいものはどれか。\n「この魚は生で食べられる。」", "a": "可能", "w": ["尊敬", "自発", "受け身"], "ex": "「～することができる」の意味は可能。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の文の「れた」の意味として正しいものはどれか。\n「雨に降られた。」", "a": "受け身", "w": ["尊敬", "可能", "自発"], "ex": "他から動作を受ける意味は受け身。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "「読まない」の「読ま」の活用形はどれか。", "a": "未然形", "w": ["連用形", "終止形", "仮定形"], "ex": "「ない」に続く形は未然形。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "「読んだ」の「読ん」の活用形はどれか。", "a": "連用形", "w": ["未然形", "終止形", "仮定形"], "ex": "「た」に続く形は連用形（音便の形）。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "「読めば」の「読め」の活用形はどれか。", "a": "仮定形", "w": ["未然形", "連用形", "命令形"], "ex": "「ば」に続く形は仮定形。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "動詞「来る」の活用の種類はどれか。", "a": "カ行変格活用", "w": ["上一段活用", "下一段活用", "五段活用"], "ex": "「来る」は「こ・き・くる・くれ・こい」と変化するカ行変格活用（カ変）。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "動詞「食べる」の活用の種類はどれか。", "a": "下一段活用", "w": ["上一段活用", "五段活用", "サ行変格活用"], "ex": "「食べない」とすると「べ」がエ段なので下一段活用。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の文の傍線部の品詞として正しいものはどれか。\n「とても美しい花が咲いた。」（「とても」）", "a": "副詞", "w": ["形容詞", "名詞", "連体詞"], "ex": "用言「美しい」を修飾する語で活用しないので副詞。"}, {"s": "jpn", "u": "文法", "t": "mc", "q": "次の傍線部の「の」のうち、体言（名詞）の代わりをしているものはどれか。", "a": "走るのが好きだ。", "w": ["私の本を貸す。", "雨の日は休みだ。", "青い空の広がり。"], "ex": "「走るのが」の「の」は「こと」に置き換えられる準体助詞。他は連体修飾を表す。"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「竹取の翁」とはどのような人か。", "a": "野山で竹を取って、いろいろなことに使っていた老人", "w": ["竹でつくられた人形", "竹を売り歩く商人", "竹の中に住む精霊"], "ex": "「竹を取りつつ、よろづのことに使ひけり」とあります。", "pid": "k1"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「あやしがりて」の意味として最も適切なものはどれか。", "a": "不思議に思って", "w": ["恐ろしがって", "なつかしがって", "腹を立てて"], "ex": "「あやし」は「不思議だ」の意味。", "pid": "k1"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「三寸ばかりなる人」の背の高さは、およそどれくらいか。", "a": "約9cm", "w": ["約3cm", "約30cm", "約90cm"], "ex": "一寸が約3cmなので、三寸は約9cm。", "pid": "k1"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「いふ」を現代かなづかいに直したものとして正しいものはどれか。", "a": "いう", "w": ["いぶ", "ゆう", "いふ"], "ex": "語頭以外の「ふ」は「う」に直す。「いふ」→「いう」。", "pid": "k1"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "筆者が春は最もよいとしているのは、どの時間帯か。", "a": "夜明け", "w": ["夕暮れ", "夜", "昼"], "ex": "「春は、あけぼの。」とあります。", "pid": "k2"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「やうやう」を現代かなづかいで書き、意味を答えたものとして正しいものはどれか。", "a": "ようよう（だんだん）", "w": ["やうやう（すぐに）", "ようよう（とつぜん）", "ゆうゆう（ゆっくり）"], "ex": "「やう」は「よう」と読み、「やうやう」は「だんだん」の意味。", "pid": "k2"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「をかし」の意味として最も適切なものはどれか。", "a": "趣がある", "w": ["こっけいだ", "恐ろしい", "悲しい"], "ex": "「をかし」は明るく知的な美しさを感じる「趣がある」の意味。", "pid": "k2"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "夏の夜、月のない闇夜でもすばらしいと筆者が感じているのは、何が飛び交っているからか。", "a": "蛍", "w": ["星", "雲", "雨"], "ex": "「やみもなほ、蛍の多く飛びちがひたる」とあります。", "pid": "k2"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "この文章が伝えようとしている考え方として最も適切なものはどれか。", "a": "すべてのものは移り変わり、栄えた者もやがて衰える", "w": ["努力すれば必ず成功する", "鐘の音は人の心をいやす", "強い者が最後には勝つ"], "ex": "「諸行無常」「盛者必衰」が中心の考え（無常観）。", "pid": "k3"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「おごれる人も久しからず」の意味として最も適切なものはどれか。", "a": "おごり高ぶっている人も、長くは続かない", "w": ["おごってくれる人はなかなかいない", "おごり高ぶる人は長生きだ", "人はおごりを久しく忘れない"], "ex": "「おごれる人」は思い上がった人。「久しからず」は長続きしない。", "pid": "k3"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「ただ春の夜の夢のごとし」に使われている表現技法はどれか。", "a": "直喩（比喩）", "w": ["擬人法", "倒置", "体言止め"], "ex": "「ごとし」を使ってたとえる直喩。栄華のはかなさを「春の夜の夢」にたとえる。", "pid": "k3"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「風の前の塵に同じ」は、何をたとえているか。", "a": "強い者の滅びやすさ（はかなさ）", "w": ["風の強さ", "塵の多さ", "自然の美しさ"], "ex": "風の前の塵のように、勢いの強い者もあっけなく滅びることをたとえる。", "pid": "k3"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "筆者は一日中何をしていたか。", "a": "硯に向かって、心に浮かぶことを書きつづけていた", "w": ["硯を買いに出かけていた", "客と話をして過ごしていた", "手紙を待ち続けていた"], "ex": "「日暮らし、硯にむかひて…書きつくれば」とあります。", "pid": "k4"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「こそ…ものぐるほしけれ」のように、文中の語を強調する決まりを何というか。", "a": "係り結び", "w": ["倒置", "対句", "体言止め"], "ex": "「こそ」があると文末が已然形（けれ）になる。", "pid": "k4"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "「つれづれなるままに」の意味として最も適切なものはどれか。", "a": "することがなく退屈なので", "w": ["忙しいので", "楽しくて", "急いでいるので"], "ex": "「つれづれ」は退屈なようす。", "pid": "k4"}, {"s": "jpn", "u": "古文", "t": "mc", "q": "筆者の気持ちとして最も適切なものはどれか。", "a": "書いているうちに、不思議なほど気持ちが高ぶり、夢中になる", "w": ["書くことに飽きてしまった", "書くのがつらくて仕方ない", "何も思い浮かばず困っている"], "ex": "「あやしうこそものぐるほしけれ」＝不思議なほど気が変になりそうに夢中になる、という意味。", "pid": "k4"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "筆者の主張として最も適切なものはどれか。", "a": "道具に頼る場面と、自分で考える場面を意識して使い分けることが大切だ。", "w": ["翻訳アプリは使うべきではない。", "辞書を引くことだけが勉強だ。", "答えはすぐに手に入れるのがよい。"], "ex": "最後の文に主張が述べられています。", "pid": "j1"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "文中の「その過程」が指す内容として最も適切なものはどれか。", "a": "自分で言葉の意味を考え、いくつかの候補から選ぶこと", "w": ["辞書を引く手間を省くこと", "答えをすぐに手に入れること", "翻訳アプリを使うこと"], "ex": "直前の文の内容を指しています。", "pid": "j1"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "本文の内容に合うものはどれか。", "a": "便利であることと、身につくことは別である。", "w": ["翻訳アプリは便利ではない。", "道具を使うと必ず理解が深まる。", "自分で考える場面は不要である。"], "ex": "第2文に書かれています。", "pid": "j1"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "文頭の「だから」の働きとして最も適切なものはどれか。", "a": "前の内容を理由として、結論を述べる", "w": ["前の内容と反対のことを述べる", "話題を変える", "前の内容に例を付け加える"], "ex": "順接の接続詞。直前までの理由から主張を導いています。", "pid": "j1"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "文中の「この性質」が指す内容として最も適切なものはどれか。", "a": "海の水が温まりにくく、冷めにくいこと", "w": ["陸の地面が温まりやすいこと", "暖かい空気が軽いこと", "風が吹き込むこと"], "ex": "直前の文の内容を指しています。", "pid": "j2"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "昼間に海風が吹くのはなぜか。", "a": "陸の空気が先に暖まって上昇し、そこへ海から風が吹き込むから", "w": ["海の水のほうが先に暖まるから", "夜に陸が先に冷えるから", "海から暖かい空気が流れ込むから"], "ex": "陸が先に暖まる→上昇→海から風、の順で説明されています。", "pid": "j2"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "本文の内容に合うものはどれか。", "a": "夜になると、風の向きは昼と逆になる。", "w": ["海の水は陸の地面より温まりやすい。", "海風は夜に最も強くなる。", "暖かい空気は重いので下降する。"], "ex": "最後の文に書かれています。", "pid": "j2"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "この文章の説明のしかたとして最も適切なものはどれか。", "a": "原因となる性質から順に、結果として起こる現象を説明している", "w": ["筆者の体験をもとに感想を述べている", "二つの意見を比べて批判している", "結論を最初に述べ、反対意見をしりぞけている"], "ex": "性質→昼間の変化→海風→夜、と順を追って説明しています。", "pid": "j2"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "このときの翔太の気持ちとして最も適切なものはどれか。", "a": "出場できない悔しさを抱えながらも、仲間の勝利を強く願っている", "w": ["レギュラーになれたことを誇りに思っている", "仲間をうらやましく思い、試合に興味を失っている", "試合に負けることを望んでいる"], "ex": "「それでも」から、悔しさがあっても応援する気持ちが読み取れます。", "pid": "j3"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "「タオルを握る手に自然と力がこもった」から読み取れることとして最も適切なものはどれか。", "a": "仲間を応援する思いが、無意識のうちに強くなっている", "w": ["試合の内容に退屈している", "寒さに耐えている", "レギュラーに選ばれる自信がある"], "ex": "「自然と」に、思わず力が入る気持ちが表れています。", "pid": "j3"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "本文の内容に合うものはどれか。", "a": "翔太は三年間、一度もレギュラーになれなかった。", "w": ["翔太はこの試合で活躍した。", "翔太のチームは負けている。", "翔太は声を張り上げて応援している。"], "ex": "「自分は一度もレギュラーになれなかった」とあります。声は「声にならない声」です。", "pid": "j3"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "「あと一点を守ろう」という表現から読み取れる試合の状況として最も適切なものはどれか。", "a": "翔太のチームが一点差でリードしている", "w": ["翔太のチームが一点差で負けている", "同点で延長戦に入っている", "すでに試合に勝っている"], "ex": "一点を「守る」のはリードしている側です。", "pid": "j3"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "鍋に対する「私」の見方の変化として最も適切なものはどれか。", "a": "ただの古い道具から、家族の思い出がつまった大切なものへ", "w": ["便利な道具から、役に立たない道具へ", "高価なものから、安いものへ", "新しいものから、古いものへ"], "ex": "最後の文に「ただの道具だった」「家族の時間を抱えた存在」とあります。", "pid": "j4"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "祖母が新しい鍋を買わない理由として最も適切なものはどれか。", "a": "家族の思い出がつまった大切な鍋だから", "w": ["新しい鍋は高価だから", "古い鍋のほうが使いやすいから", "父に買ってもらった鍋だから"], "ex": "祖母の言葉から、毎年の正月の雑煮という家族の時間が読み取れます。", "pid": "j4"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "「首を振った」の意味として最も適切なものはどれか。", "a": "「新しい鍋を買う」ことを断った", "w": ["わからないという意思を示した", "うれしさを表した", "おどろいた"], "ex": "首を横に振る動作は否定・拒否を表します。", "pid": "j4"}, {"s": "jpn", "u": "現代文", "t": "mc", "q": "「私は黙って鍋を見つめた」ときの「私」の心情として最も適切なものはどれか。", "a": "祖母の言葉に心を動かされている", "w": ["祖母に腹を立てている", "鍋の古さにあきれている", "話題を変えたいと思っている"], "ex": "「黙って」見つめる様子と、その後の見方の変化から、心を動かされたことがわかります。", "pid": "j4"}, {"s": "sci", "u": "物理", "t": "num", "q": "抵抗10Ωの電熱線に6Vの電圧を加えた。流れる電流は何Aか。", "a": "0.6", "ex": "オームの法則 I=V÷R=6÷10=0.6A。"}, {"s": "sci", "u": "物理", "t": "num", "q": "ある抵抗に12Vの電圧を加えると0.5Aの電流が流れた。この抵抗は何Ωか。", "a": "24", "ex": "R=V÷I=12÷0.5=24Ω。"}, {"s": "sci", "u": "物理", "t": "num", "q": "10Ωと20Ωの抵抗を直列につないだ。全体の抵抗は何Ωか。", "a": "30", "ex": "直列つなぎの合成抵抗は和。10+20=30Ω。"}, {"s": "sci", "u": "物理", "t": "num", "q": "20Ωと30Ωの抵抗を並列につないだ。全体の抵抗は何Ωか。", "a": "12", "ex": "1/R=1/20+1/30=5/60=1/12 なので R=12Ω。"}, {"s": "sci", "u": "物理", "t": "num", "q": "100Vの電源につないだ電気器具に2Aの電流が流れた。消費電力は何Wか。", "a": "200", "ex": "電力(W)=電圧(V)×電流(A)=100×2=200W。"}, {"s": "sci", "u": "物理", "t": "num", "q": "60Wの電球を3時間使った。電力量は何Whか。", "a": "180", "ex": "電力量(Wh)=電力(W)×時間(h)=60×3=180Wh。"}, {"s": "sci", "u": "物理", "t": "num", "q": "質量300gの物体にはたらく重力の大きさは何Nか。（100gの物体にはたらく重力を1Nとする）", "a": "3", "ex": "100gで1Nなので、300gは3N。"}, {"s": "sci", "u": "物理", "t": "num", "q": "600Nの力が面積0.5m²の面に垂直にはたらいている。圧力は何Paか。", "a": "1200", "ex": "圧力(Pa)=力(N)÷面積(m²)=600÷0.5=1200Pa。"}, {"s": "sci", "u": "物理", "t": "num", "q": "ばねに1Nの力を加えると2cmのびる。このばねに3Nの力を加えると何cmのびるか。", "a": "6", "ex": "ばねののびは力に比例（フックの法則）。2×3=6cm。"}, {"s": "sci", "u": "物理", "t": "num", "q": "10Nの力で物体を力の向きに3m動かした。仕事は何Jか。", "a": "30", "ex": "仕事(J)=力(N)×距離(m)=10×3=30J。"}, {"s": "sci", "u": "物理", "t": "num", "q": "60Jの仕事を5秒間で行った。仕事率は何Wか。", "a": "12", "ex": "仕事率(W)=仕事(J)÷時間(s)=60÷5=12W。"}, {"s": "sci", "u": "物理", "t": "num", "q": "120mを20秒で走った。平均の速さは何m/sか。", "a": "6", "ex": "速さ=距離÷時間=120÷20=6m/s。"}, {"s": "sci", "u": "物理", "t": "num", "q": "時速72kmで走る自動車の速さは秒速何mか。", "a": "20", "ex": "72km=72000m、1時間=3600秒。72000÷3600=20m/s。"}, {"s": "sci", "u": "物理", "t": "num", "q": "花火が光ってから3秒後に音が聞こえた。音の速さを340m/sとすると、花火までの距離は何mか。", "a": "1020", "ex": "距離=速さ×時間=340×3=1020m。光の伝わる時間は無視できます。"}, {"s": "sci", "u": "物理", "t": "num", "q": "空気中で3.0Nのおもりを水中に入れると、ばねばかりの値が2.2Nになった。おもりにはたらく浮力は何Nか。", "a": "0.8", "ex": "浮力=空気中の値−水中の値=3.0−2.2=0.8N。"}, {"s": "sci", "u": "物理", "t": "num", "q": "鏡に光が入射角30°で当たった。反射角は何度か。", "a": "30", "ex": "光の反射の法則により、入射角と反射角は等しい。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "凸レンズの焦点距離の2倍の位置に物体を置いたとき、反対側の焦点距離の2倍の位置にできる像はどれか。", "a": "物体と同じ大きさの上下左右が逆向きの実像", "w": ["物体より大きい実像", "物体より小さい虚像", "物体と同じ向きの虚像"], "ex": "焦点距離の2倍の位置では、同じ大きさの倒立実像ができます。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "電車が急に動き出したとき、乗っている人が後ろに倒れそうになるのはなぜか。", "a": "慣性により、人はその場にとどまろうとするから", "w": ["人に後ろ向きの力がはたらくから", "床の摩擦がなくなるから", "重力が弱くなるから"], "ex": "慣性の法則。物体は、力がはたらかなければ、静止または等速直線運動を続けようとします。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "物体Aが物体Bを押すと、物体Bも物体Aを押し返す。この関係を何というか。", "a": "作用・反作用の法則", "w": ["慣性の法則", "フックの法則", "オームの法則"], "ex": "2つの物体の間にはたらく、大きさが等しく向きが反対の力の関係。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "電流計・電圧計のつなぎ方として正しいものはどれか。", "a": "電流計は回路に直列、電圧計は調べたい部分に並列につなぐ", "w": ["どちらも直列につなぐ", "どちらも並列につなぐ", "電流計は並列、電圧計は直列につなぐ"], "ex": "電流計は電流の通り道に、電圧計は両端に並列にして測ります。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "物体が一定の速さで一直線上を動く運動を何というか。", "a": "等速直線運動", "w": ["自由落下運動", "等加速度運動", "円運動"], "ex": "力がはたらかない（つり合っている）ときの運動。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "水平な面上で物体にはたらく力がつり合っているとき、物体の運動として正しいものはどれか。", "a": "静止し続けるか、等速直線運動を続ける", "w": ["だんだん速くなる", "だんだん遅くなる", "向きを変える"], "ex": "力がつり合っているとき、運動の状態は変わりません。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "エネルギーの保存について、振り子の運動で正しいものはどれか。", "a": "摩擦や空気抵抗がなければ、力学的エネルギーは一定に保たれる", "w": ["最下点で位置エネルギーが最大になる", "最高点で運動エネルギーが最大になる", "エネルギーは増え続ける"], "ex": "最高点で位置エネルギー最大、最下点で運動エネルギー最大。その和は一定です。"}, {"s": "sci", "u": "物理", "t": "mc", "q": "磁界の中を流れる電流が受ける力を利用した装置はどれか。", "a": "モーター", "w": ["発電機", "変圧器", "電熱器"], "ex": "モーターは電流が磁界から受ける力で回転します。発電機は電磁誘導を利用します。"}, {"s": "sci", "u": "化学", "t": "num", "q": "質量54g、体積20cm³の金属の密度は何g/cm³か。", "a": "2.7", "ex": "密度=質量÷体積=54÷20=2.7g/cm³。"}, {"s": "sci", "u": "化学", "t": "num", "q": "食塩20gを水80gにとかした。この食塩水の質量パーセント濃度は何％か。", "a": "20", "ex": "濃度(%)=溶質÷(溶質+溶媒)×100=20÷100×100=20%。"}, {"s": "sci", "u": "化学", "t": "num", "q": "銅4.0gを加熱して完全に酸化させたら、酸化銅が5.0gできた。結びついた酸素は何gか。", "a": "1.0", "ex": "質量保存の法則より、酸化銅5.0g−銅4.0g=1.0g。"}, {"s": "sci", "u": "化学", "t": "num", "q": "銅と酸素は4：1の質量比で結びつく。銅6.0gを完全に酸化させると、酸化銅は何gできるか。", "a": "7.5", "ex": "銅6.0gと結びつく酸素は6.0÷4=1.5g。酸化銅は6.0+1.5=7.5g。"}, {"s": "sci", "u": "化学", "t": "num", "q": "水を電気分解すると、陰極で水素、陽極で酸素が発生する。水素が20cm³発生したとき、酸素は何cm³発生するか。", "a": "10", "ex": "水素：酸素の体積比は2：1。"}, {"s": "sci", "u": "化学", "t": "num", "q": "10％の食塩水200gには、食塩が何gとけているか。", "a": "20", "ex": "溶質の質量=溶液の質量×濃度=200×0.10=20g。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "水の化学式として正しいものはどれか。", "a": "H₂O", "w": ["CO₂", "NaCl", "O₂"], "ex": "水は水素原子2個と酸素原子1個からできています。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "二酸化炭素を石灰水に通したときの変化として正しいものはどれか。", "a": "石灰水が白くにごる", "w": ["石灰水が青くなる", "石灰水が赤くなる", "変化しない"], "ex": "二酸化炭素の確認に石灰水を使います。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "酸素を発生させる方法として正しいものはどれか。", "a": "二酸化マンガンにうすい過酸化水素水を加える", "w": ["石灰石にうすい塩酸を加える", "亜鉛にうすい塩酸を加える", "塩化アンモニウムと水酸化カルシウムを加熱する"], "ex": "二酸化マンガンは触媒としてはたらきます。選択肢は順に、二酸化炭素・水素・アンモニアの発生方法。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "水素を発生させる方法として正しいものはどれか。", "a": "亜鉛にうすい塩酸を加える", "w": ["石灰石にうすい塩酸を加える", "二酸化マンガンにうすい過酸化水素水を加える", "塩化アンモニウムと水酸化カルシウムを加熱する"], "ex": "金属と酸が反応して水素が発生します。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "アンモニアの性質として正しいものはどれか。", "a": "水に非常によくとけ、水溶液はアルカリ性を示す", "w": ["水にほとんどとけない", "無臭で空気より重い", "水溶液は酸性を示す"], "ex": "アンモニアは刺激臭があり、水溶液はアルカリ性。上方置換法で集めます。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "BTB溶液を加えたとき、中性の水溶液は何色になるか。", "a": "緑色", "w": ["黄色", "青色", "赤色"], "ex": "BTB溶液は酸性で黄色、中性で緑色、アルカリ性で青色。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "フェノールフタレイン溶液を加えると赤くなる水溶液はどれか。", "a": "アルカリ性の水溶液", "w": ["酸性の水溶液", "中性の水溶液", "どの水溶液でも赤くなる"], "ex": "アルカリ性で赤色に変化します。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "酸性の水溶液に共通して含まれるイオンはどれか。", "a": "水素イオン", "w": ["水酸化物イオン", "ナトリウムイオン", "塩化物イオン"], "ex": "酸は水にとけて水素イオン（H⁺）を生じます。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "塩酸と水酸化ナトリウム水溶液が過不足なく反応したときにできる物質の組み合わせとして正しいものはどれか。", "a": "塩化ナトリウムと水", "w": ["水素と酸素", "塩化ナトリウムと二酸化炭素", "水酸化ナトリウムと水素"], "ex": "酸とアルカリの中和で、塩と水ができます。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "水素が燃えるときの化学反応式として正しいものはどれか。", "a": "2H₂＋O₂ → 2H₂O", "w": ["H₂＋O₂ → H₂O", "H₂＋2O₂ → 2H₂O", "2H₂＋2O₂ → 2H₂O"], "ex": "左右で原子の数が等しくなるように係数をつけます。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "酸化銅を炭素の粉末と混ぜて加熱したときに起こる反応として正しいものはどれか。", "a": "酸化銅は還元されて銅になり、炭素は酸化されて二酸化炭素になる", "w": ["銅が酸化されて酸化銅になる", "炭素が還元されて二酸化炭素になる", "何も変化しない"], "ex": "酸化銅は酸素をうばわれて銅になる（還元）。炭素は酸素と結びつく（酸化）。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "塩化銅水溶液を電気分解したとき、陰極に付着する物質はどれか。", "a": "銅", "w": ["塩素", "水素", "酸素"], "ex": "陰極に銅がつき、陽極から塩素が発生します。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "物質が状態変化しても変わらないものはどれか。", "a": "質量", "w": ["体積", "密度", "粒子の間隔"], "ex": "状態変化では体積は変わりますが、質量は変わりません。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "液体の混合物から、沸点の差を利用して物質を分けとる方法はどれか。", "a": "蒸留", "w": ["ろ過", "再結晶", "クロマトグラフィー"], "ex": "エタノールと水の混合物などを加熱して分けます。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "純粋な物質（純物質）はどれか。", "a": "蒸留水", "w": ["食塩水", "空気", "海水"], "ex": "1種類の物質だけでできているものが純物質です。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "金属の性質として正しいものはどれか。", "a": "電気をよく通し、みがくと光る", "w": ["どの金属も磁石につく", "たたくと割れる", "電気を通さない"], "ex": "金属には電気伝導性・熱伝導性・金属光沢・展性・延性があります。磁石につくのは鉄などの一部です。"}, {"s": "sci", "u": "化学", "t": "mc", "q": "質量保存の法則について正しい説明はどれか。", "a": "化学変化の前後で、物質全体の質量は変わらない", "w": ["化学変化の前後で、原子の種類が変わる", "気体が発生すると質量が必ず減る", "密閉した容器内でも、化学変化の前後で質量が変わる"], "ex": "密閉した容器内なら質量は変わりません。"}, {"s": "sci", "u": "生物", "t": "num", "q": "エンドウの丸い種子（優性、遺伝子型Aa）どうしをかけ合わせて、できた種子を800個得た。このうち、しわのある種子（aa）は理論上何個か。", "a": "200", "ex": "Aa×Aa から、AA：Aa：aa=1：2：1。しわ(aa)は1/4で800÷4=200個。"}, {"s": "sci", "u": "生物", "t": "num", "q": "Aaの個体を自家受粉させたとき、できる子のうち遺伝子型がAaになる割合は全体の何％か。", "a": "50", "ex": "AA：Aa：aa=1：2：1 なので、Aaは2/4=50%。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "植物の光合成について正しい説明はどれか。", "a": "光を受けて、二酸化炭素と水からデンプンなどと酸素をつくる", "w": ["酸素と水からデンプンをつくる", "夜間に最もさかんに行われる", "動物の細胞でも同じように行われる"], "ex": "光合成は葉緑体で行われ、光エネルギーを利用します。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "植物の細胞に見られるが、動物の細胞には見られないつくりはどれか。", "a": "葉緑体と細胞壁", "w": ["核と細胞膜", "細胞質と核", "ミトコンドリア"], "ex": "植物の細胞には細胞壁・葉緑体・液胞があります。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "顕微鏡の使い方として正しいものはどれか。", "a": "最初は低倍率で観察し、ピントを合わせる", "w": ["最初から高倍率で観察する", "対物レンズはプレパラートに近づけながら見る", "反射鏡は使わない"], "ex": "低倍率→高倍率の順。ピントは対物レンズとプレパラートを遠ざけながら合わせます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "被子植物で、受粉後に種子になる部分と、果実になる部分の組み合わせとして正しいものはどれか。", "a": "胚珠が種子になり、子房が果実になる", "w": ["子房が種子になり、胚珠が果実になる", "柱頭が種子になり、花弁が果実になる", "胚珠が果実になり、やくが種子になる"], "ex": "胚珠→種子、子房→果実。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "だ液にふくまれる消化酵素アミラーゼのはたらきとして正しいものはどれか。", "a": "デンプンを糖に分解する", "w": ["タンパク質をアミノ酸に分解する", "脂肪を分解する", "糖をデンプンに合成する"], "ex": "だ液中のアミラーゼはデンプンを分解します。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "タンパク質を分解する消化酵素を含む消化液はどれか。", "a": "胃液", "w": ["だ液", "胆汁", "うすい塩酸"], "ex": "胃液にはタンパク質を分解するペプシンが含まれます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "小腸の壁にあるひだと柔毛が多数あることの利点はどれか。", "a": "表面積が大きくなり、栄養分を効率よく吸収できる", "w": ["食物が早く通過できる", "消化液がたくさん出る", "細菌が入りにくくなる"], "ex": "小腸の内側の表面積が大きいほど、栄養分を吸収しやすくなります。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "血液の成分のうち、酸素を運ぶはたらきをするものはどれか。", "a": "赤血球", "w": ["白血球", "血小板", "血しょう"], "ex": "赤血球に含まれるヘモグロビンが酸素と結びつきます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "心臓から肺へ向かう血管を流れる血液を何というか。", "a": "静脈血", "w": ["動脈血", "リンパ液", "組織液"], "ex": "肺動脈には全身から戻ってきた酸素の少ない静脈血が流れます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "体内で不要になったアンモニアは、おもにどこで尿素に変えられるか。", "a": "肝臓", "w": ["腎臓", "小腸", "心臓"], "ex": "肝臓で有害なアンモニアが尿素に変えられ、腎臓でこしとられます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "熱いものにふれて思わず手を引っこめる反応を何というか。", "a": "反射", "w": ["感覚", "随意運動", "記憶"], "ex": "反射は脳を通らず、せきずいなどから命令が出るため速く反応できます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "刺激を受けとる器官で、光の刺激を受けとるものはどれか。", "a": "目（網膜）", "w": ["耳（うずまき管）", "鼻（嗅細胞）", "皮膚（感覚点）"], "ex": "光の刺激は目の網膜で受けとります。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "メンデルの実験で、純系の丸い種子（AA）としわのある種子（aa）をかけ合わせたとき、子（F₁）の種子はどうなるか。", "a": "すべて丸い種子（Aa）になる", "w": ["丸としわが1：1", "すべてしわのある種子になる", "丸としわが3：1"], "ex": "優性の法則。優性の形質だけが現れます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "生態系で、無機物から有機物をつくる生物はどれか。", "a": "生産者（植物など）", "w": ["消費者", "分解者", "捕食者"], "ex": "生産者は光合成で有機物をつくります。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "生態系で、動物の死がいやふんを無機物に分解する生物はどれか。", "a": "分解者（菌類・細菌類など）", "w": ["生産者", "一次消費者", "二次消費者"], "ex": "分解者は菌類や細菌類です。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "食物連鎖で、数量が最も多いのはどれか。", "a": "生産者", "w": ["一次消費者", "二次消費者", "高次消費者"], "ex": "ピラミッドの底辺ほど数量が多くなります。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "無性生殖の特徴として正しいものはどれか。", "a": "子は親と同じ遺伝子をもつ", "w": ["子は親と必ずちがう形質をもつ", "雌雄の生殖細胞が必要", "環境の変化に強くなりやすい"], "ex": "無性生殖では親のからだの一部から子ができるので、遺伝子は同じです。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "動物の体細胞分裂について正しいものはどれか。", "a": "分裂前に染色体が複製され、同じ数の染色体をもつ2個の細胞になる", "w": ["染色体の数が半分になる", "染色体の数が2倍になる", "核は分裂しない"], "ex": "体細胞分裂では染色体の数は変わりません。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "脊椎動物のうち、卵に殻があり陸上に産む動物はどれか。", "a": "は虫類", "w": ["両生類", "魚類", "哺乳類（カモノハシを除く）"], "ex": "は虫類・鳥類は陸上に殻のある卵を産みます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "植物の根のつくりで、水や養分を吸収する部分はどれか。", "a": "根毛", "w": ["道管", "師管", "形成層"], "ex": "根毛は根の先端付近にある細い毛です。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "植物の体内で、根から吸収した水が通る管はどれか。", "a": "道管", "w": ["師管", "気孔", "表皮"], "ex": "師管は葉でつくられた栄養分を運びます。"}, {"s": "sci", "u": "生物", "t": "mc", "q": "気孔から水蒸気が出ていくことを何というか。", "a": "蒸散", "w": ["光合成", "呼吸", "吸収"], "ex": "蒸散は主に葉の裏側の気孔で行われます。"}, {"s": "sci", "u": "地学", "t": "num", "q": "地震のP波は秒速6km、S波は秒速3kmで伝わる。初期微動継続時間が12秒だった地点の震源距離は何kmか。", "a": "72", "ex": "震源距離をdとすると d/3−d/6=12。d/6=12よりd=72km。"}, {"s": "sci", "u": "地学", "t": "num", "q": "気温20℃の空気1m³にふくまれる水蒸気量が8.65gのとき、湿度は何％か。（20℃の飽和水蒸気量は17.3g/m³）", "a": "50", "ex": "湿度(%)=水蒸気量÷飽和水蒸気量×100=8.65÷17.3×100=50%。"}, {"s": "sci", "u": "地学", "t": "num", "q": "気温30℃、湿度40％の空気1m³にふくまれる水蒸気量は何gか。（30℃の飽和水蒸気量は30.4g/m³）小数第2位を四捨五入して答えよ。", "a": "12.2", "ex": "水蒸気量=飽和水蒸気量×湿度=30.4×0.40=12.16≒12.2g。"}, {"s": "sci", "u": "地学", "t": "num", "q": "北緯35°の地点で、春分の日の太陽の南中高度は何度か。", "a": "55", "ex": "春分・秋分の南中高度は 90°−緯度=90−35=55°。"}, {"s": "sci", "u": "地学", "t": "num", "q": "地軸の傾きを23.4°とする。北緯35°の地点で、夏至の日の太陽の南中高度は何度か。", "a": "78.4", "ex": "夏至の南中高度は 90°−緯度＋23.4°=90−35+23.4=78.4°。"}, {"s": "sci", "u": "地学", "t": "num", "q": "北の空の星は、1時間に15°ずつ動いて見える。3時間では何度動くか。", "a": "45", "ex": "地球の自転は1時間に360÷24=15°。15×3=45°。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "地震のゆれの大きさ（強さ）を表すものはどれか。", "a": "震度", "w": ["マグニチュード", "震央距離", "初期微動継続時間"], "ex": "震度はある場所でのゆれの大きさ、マグニチュードは地震そのものの規模。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "地震で、はじめに小さなゆれを伝える波はどれか。", "a": "P波", "w": ["S波", "表面波", "津波"], "ex": "P波は速く伝わり初期微動を起こし、S波は主要動を起こします。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "日本列島付近で、海洋プレートが大陸プレートの下にしずみこむ場所にできる地形はどれか。", "a": "海溝", "w": ["海嶺", "三角州", "大陸棚"], "ex": "日本海溝や南海トラフがその例です。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "マグマのねばりけが強い火山の特徴として正しいものはどれか。", "a": "ドーム状の形で、噴火が激しい", "w": ["傾斜がゆるやかな形で、おだやかに噴火する", "溶岩が遠くまで流れる", "黒っぽい溶岩をふき出す"], "ex": "ねばりけが強いと白っぽい溶岩でドーム状になります（例：昭和新山）。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "深成岩に分類される岩石はどれか。", "a": "花こう岩", "w": ["玄武岩", "安山岩", "流紋岩"], "ex": "マグマが地下深くでゆっくり冷え固まった岩石。深成岩は花こう岩、せん緑岩、はんれい岩。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "地層の中から見つかる化石のうち、地層がたい積した年代を知る手がかりになるものを何というか。", "a": "示準化石", "w": ["示相化石", "標本化石", "生痕化石"], "ex": "三葉虫・アンモナイトなどは示準化石。サンゴは示相化石（あたたかく浅い海）。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "火山灰などが固まってできた堆積岩はどれか。", "a": "凝灰岩", "w": ["石灰岩", "砂岩", "チャート"], "ex": "火山灰・火山れきなどが固まった堆積岩。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "石灰岩にうすい塩酸をかけたとき起こる変化として正しいものはどれか。", "a": "二酸化炭素が発生する", "w": ["水素が発生する", "酸素が発生する", "変化しない"], "ex": "石灰岩の主成分は炭酸カルシウムです。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "寒冷前線が通過するときの天気の変化として最も適切なものはどれか。", "a": "せまい範囲に強い雨が短時間降り、通過後に気温が下がる", "w": ["広い範囲に弱い雨が長時間降り、通過後に気温が上がる", "雨は降らずに気温が上がる", "風がやみ、霧が出る"], "ex": "寒冷前線では積乱雲が発達します。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "温暖前線の特徴として正しいものはどれか。", "a": "暖気が寒気の上にゆるやかにはい上がる", "w": ["寒気が暖気の下にもぐりこむ", "前線の傾きが急である", "突風と雷雨を伴う"], "ex": "温暖前線では乱層雲が広がり、弱い雨が広い範囲に降ります。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "高気圧の中心付近で見られる空気の流れとして正しいものはどれか。", "a": "下降気流で、時計回りに風が吹き出す", "w": ["上昇気流で、反時計回りに風が吹きこむ", "上昇気流で、時計回りに風が吹き出す", "下降気流で、反時計回りに風が吹き込む"], "ex": "北半球では高気圧は時計回りに吹き出し、中心は下降気流で晴れやすい。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "日本の冬の天気に最も関係の深い気団はどれか。", "a": "シベリア気団", "w": ["小笠原気団", "オホーツク海気団", "揚子江気団"], "ex": "冬はシベリア気団から北西の季節風が吹き、日本海側に雪を降らせます。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "月が地球と太陽の間に入り、太陽をかくす現象を何というか。", "a": "日食", "w": ["月食", "満月", "新月の食"], "ex": "日食は新月のとき、月食は満月のときに起こります。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "金星について正しいものはどれか。", "a": "明け方の東の空か、夕方の西の空にしか見えない", "w": ["真夜中に南中する", "満ち欠けしない", "一年中同じ形に見える"], "ex": "金星は地球より内側を公転するため、真夜中には見えません。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "太陽系の惑星のうち、地球型惑星はどれか。", "a": "火星", "w": ["木星", "土星", "天王星"], "ex": "水星・金星・地球・火星が地球型惑星で、岩石でできています。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "太陽系で、太陽に最も近い惑星はどれか。", "a": "水星", "w": ["金星", "火星", "地球"], "ex": "太陽に近い順に、水・金・地・火・木・土・天・海。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "北極星の近くの星が、一日かけて北極星を中心に回転して見える向きはどれか。", "a": "反時計回り", "w": ["時計回り", "東から西へ直線的に動く", "動かない"], "ex": "北の空の星の日周運動は、地球の自転により反時計回りに見えます。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "季節によって太陽の南中高度が変わる主な原因はどれか。", "a": "地軸が公転面に垂直な方向に対して傾いたまま公転しているから", "w": ["地球と太陽の距離が大きく変わるから", "太陽が自転しているから", "月の引力が変化するから"], "ex": "地軸の傾きが季節の変化の原因です。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "天気記号「○」が表す天気はどれか。", "a": "快晴", "w": ["晴れ", "くもり", "雨"], "ex": "雲量が0〜1のとき快晴（○）、2〜8のとき晴れ（⦶）、9〜10のときくもり（◎）。"}, {"s": "sci", "u": "地学", "t": "mc", "q": "露点とは何か。", "a": "空気中の水蒸気が凝結し始める温度", "w": ["水が沸騰する温度", "気温と湿度が等しくなる温度", "空気が最も暖まる温度"], "ex": "露点より気温が下がると、水滴が現れます。"}, {"s": "soc", "u": "地理", "t": "mc", "q": "日本の標準時子午線が通る経線として正しいものはどれか。", "a": "東経135度", "w": ["東経120度", "東経140度", "東経150度"], "ex": "兵庫県明石市を通る東経135度の経線が日本の標準時子午線です。"}, {"s": "soc", "u": "地理", "t": "num", "q": "日本（東経135度）が1月1日午前0時のとき、経度0度のイギリス（ロンドン）は12月31日の何時か。24時間制で数字のみ答えよ。", "a": "15", "ex": "経度15度で1時間の差。135÷15=9時間。日本が9時間進んでいるので、24−9=15時。"}, {"s": "soc", "u": "地理", "t": "num", "q": "2万5千分の1の地形図上で4cmの長さは、実際の距離では何mか。", "a": "1000", "ex": "4cm×25000=100000cm=1000m。"}, {"s": "soc", "u": "地理", "t": "num", "q": "5万分の1の地形図上で3cmの長さは、実際の距離では何kmか。", "a": "1.5", "ex": "3cm×50000=150000c var PASS={"p1": "Last Sunday, our class cleaned the park near our school. At first, I did not want to join because I was tired from basketball practice. But when I saw many people working together, I changed my mind. An old man smiled at us and said, \"Thank you. The park is so beautiful now.\" His words made me happy. I learned that small actions can make people happy. Next month, I will join the cleaning again with my friends.", "p2": "Hi Kenta,\nThank you for your e-mail. I'm glad to hear that you will visit Canada this summer. I live in Vancouver with my parents and my little sister. We have a small dog named Max. He likes to run on the beach every morning. Do you like dogs? If you want, you can walk with him. I'm also planning a barbecue party on August 10. My friends want to meet you. Please tell me what food you can't eat.\nSee you soon!\nEmily", "p3": "In my town, many shops stopped giving free plastic bags two years ago. Now, people bring their own bags when they go shopping. My mother has a cloth bag that my grandmother made. At first, some people felt it was a trouble to remember their bags. However, they got used to it soon. The streets are cleaner now, and I can see fewer bags in the river. I think we can protect the environment if we change our daily habits a little.", "p4": "I started playing the piano when I was five. I practiced every day, but I stopped when I entered junior high school because I was busy with the tennis club. Last winter, my grandfather got sick and stayed in the hospital. I played the piano for him in the lobby of the hospital. He listened carefully and said, \"Your music gives me power.\" After that day, I started to practice again. Now I play the piano for him at his home every weekend.", "p5": "Summer English Camp\nDate: July 25 - 27\nPlace: Green Hill Camp Site\nYou can enjoy cooking, games, and talking with students from other countries.\nFee: 12,000 yen (food and bus are included)\nYou need to bring a towel and a water bottle.\nIf you want to join, please call Ms. Brown by July 10. Only 30 students can join.", "p6": "Some people say that students should not bring smartphones to school. I don't think so. Smartphones are useful for studying. For example, I use a dictionary app when I find new words, and I can check train times when there is a problem on the way home. Of course, we should not use them during classes. If we follow the rules, smartphones will help us a lot.", "k1": "今は昔、竹取の翁といふものありけり。野山にまじりて竹を取りつつ、よろづのことに使ひけり。名をば、さぬきの造となむいひける。その竹の中に、もと光る竹なむ一筋ありける。あやしがりて、寄りて見るに、筒の中光りたり。それを見れば、三寸ばかりなる人、いとうつくしうてゐたり。\n（『竹取物語』より）\n〔注〕翁＝おじいさん　よろづ＝いろいろ　寸＝長さの単位。一寸は約3cm", "k2": "春は、あけぼの。やうやう白くなりゆく山ぎは、少しあかりて、紫だちたる雲の細くたなびきたる。\n夏は、夜。月のころはさらなり、やみもなほ、蛍の多く飛びちがひたる。また、ただ一つ二つなど、ほのかにうち光りて行くもをかし。雨など降るもをかし。\n（『枕草子』より）\n〔注〕あけぼの＝夜明け　山ぎは＝山の稜線のあたり　さらなり＝言うまでもない　やみ＝月の出ていない闇夜", "k3": "祇園精舎の鐘の声、諸行無常の響きあり。沙羅双樹の花の色、盛者必衰の理をあらはす。おごれる人も久しからず、ただ春の夜の夢のごとし。たけき者もつひには滅びぬ、ひとへに風の前の塵に同じ。\n（『平家物語』より）\n〔注〕諸行無常＝この世のものはすべて移り変わるということ　盛者必衰＝栄えている者もいつか必ず衰えるということ　理＝道理　たけき者＝勢いの強い者", "k4": "つれづれなるままに、日暮らし、硯にむかひて、心にうつりゆくよしなしごとを、そこはかとなく書きつくれば、あやしうこそものぐるほしけれ。\n（『徒然草』序段より）\n〔注〕つれづれ＝することがなく退屈なこと　日暮らし＝一日中　硯＝墨をする道具　よしなしごと＝とりとめのないこと　そこはかとなく＝とりとめもなく　ものぐるほし＝気が変になりそうだ", "j1": "辞書を引く手間を省いてくれる翻訳アプリは、確かに便利だ。しかし、便利であることと、身につくことは別である。自分で言葉の意味を考え、いくつかの候補から選ぶ過程にこそ、理解を深める力が働く。答えをすぐに手に入れられる環境では、その過程が省かれがちになる。だから、道具に頼る場面と、自分の頭を使う場面を意識して使い分けることが大切だ。", "j2": "海の水は、同じ日差しを受けても、陸の地面にくらべて温まりにくい。一方で、一度温まると冷めにくい。この性質のため、昼間は海より陸のほうが先に暖かくなる。暖かい空気は軽いので上昇し、そこへ海から冷たい風が吹き込む。これが海風である。夜になると陸は先に冷え、風の向きは逆になる。", "j3": "翔太は、決勝戦のベンチで膝を抱えていた。三年間ともに練習した仲間が、あと一点を守ろうとグラウンドで声を張り上げている。自分は一度もレギュラーになれなかった。それでも、タオルを握る手に自然と力がこもった。「頼む、守りきってくれ。」声にならない声が、胸の中で何度も響いた。", "j4": "祖母の家の台所には、いつも同じ古い鍋がある。持ち手は少し欠け、底は黒ずんでいる。新しい鍋を買えば便利だと言うと、祖母は笑って首を振った。「この鍋はね、お前のお父さんが小さい頃から、毎年の正月に雑煮を作ってきたんだよ。」私は黙って鍋を見つめた。ただの道具だったそれが、急に家族の時間を抱えた存在に見えてきた。"};

}

function parseN(s){
  s=String(s).trim().replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/．/g,'.').replace(/／/g,'/');
  s=s.replace(/[−ー―‐–]/g,'-').replace(/\s+/g,'').replace(/^[a-zA-Z]+=/,'').replace(/[^0-9\/.\-]+$/,'');
  return s;
}
function numVal(s){
  var m=/^(-?)(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/.exec(s); if(!m) return null;
  var v=parseFloat(m[2]); if(m[3]){ var d=parseFloat(m[3]); if(!d) return null; v=v/d; }
  return m[1]?-v:v;
}
function checkNum(q,input){
  var a=parseN(input), b=parseN(q.a), x=numVal(a), y=numVal(b);
  if(x!==null&&y!==null) return Math.abs(x-y)<1e-6;
  return a===b;
}

  var st=document.getElementById('audst'); if(st) st.textContent='再生中…';

function buildMock(s){
  var def=MOCK[s], ids=[], secs=[], opts={};
  def.secs.forEach(function(sec,si){
    var pool=ALL.filter(function(q){return q.s===s&&q.cat===sec.cat;}), pick=[];
    if(sec.passages){
      var seen={}; pool.forEach(function(q){ if(q.pid) seen[q.pid]=1; });
      var pids=shuffle(Object.keys(seen)).slice(0,sec.passages);
      pids.forEach(function(p){ pick=pick.concat(pool.filter(function(q){return q.pid===p;})); });
    }else pick=shuffle(pool).slice(0,sec.n);
    pick.forEach(function(q){ ids.push(q.id); secs.push(si); if(q.t==='mc') opts[q.id]=shuffle([q.a].concat(q.w)); });
  });
  return {s:s,ids:ids,secs:secs,opts:opts,ans:{},i:0,plays:{},pads:{},startAt:Date.now(),endAt:Date.now()+MOCK_SEC*1000};
}

var TIPS={
